<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hệ thống thi trắc nghiệm trực tuyến - Công an xã Thuần Trung</title>
<style>
:root{--navy:#0a2a6e;--blue:#1a5fe0;--bg:#f3f6fc;--line:#e3e9f5;--tx:#16233f;--mut:#6b7a99;--ok:#18a05a;--bad:#e5484d;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--line:#24324f;--tx:#e6ecf9;--mut:#93a2c4;--card:#15203a}}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--line)}.btn.s{padding:5px 11px;font-size:12px}.btn.r{background:var(--bad)}.btn.g{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:18px 10px}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.hero{background:linear-gradient(160deg,#0a2a6e,#0f3a96 60%,#1b4eb8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.hero h1{font-size:22px}.hero em{margin-top:22px;font-size:16px;line-height:1.7}
.side{display:flex;flex-direction:column;justify-content:space-between;background:var(--card)}
.box{max-width:420px;width:100%;margin:auto;padding:28px 22px;display:flex;flex-direction:column;gap:12px}
.box h2{text-align:center;font-size:21px}.sub{text-align:center;color:var(--mut)}
.box label,.fg label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.err{color:var(--bad);font-size:12px;min-height:16px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:8px}
.pick input{width:auto;margin-top:3px}.pick small{display:block;color:var(--mut)}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0a2a6e,#0b2f7c);color:#fff;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px;font-weight:700;font-size:13px;line-height:1.25}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav a{display:flex;gap:10px;padding:10px 12px;border-radius:8px;color:#d6e0fa;cursor:pointer;font-size:13px}
nav a.on{background:var(--blue);color:#fff;font-weight:600}
main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line)}
#menu{display:none;background:none;border:0;font-size:22px;cursor:pointer}
.page{padding:22px;flex:1}.page h2{font-size:18px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{border-radius:12px;color:#fff;padding:16px 18px;display:flex;flex-direction:column}.stat b{font-size:28px}.stat span{font-size:12px;opacity:.92}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools>input,.tools>select{flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);text-align:left;padding:10px;font-size:12px;color:var(--mut)}td{padding:10px;border-top:1px solid var(--line)}
.tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.tg{background:#dcf5e8;color:#0d7a42}.ty{background:#fdf0d4;color:#9a6200}.tr{background:#fde2e3;color:#b3262b}.tb{background:#dde8fd;color:#1b4fb8}.tx{background:#e8ebf2;color:#51607f}
.ic{background:none;border:0;cursor:pointer;font-size:15px;padding:2px 6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w{grid-column:1/-1}
.mod{position:fixed;inset:0;background:rgba(5,15,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mod>div{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.mod h3{margin-bottom:14px}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ex{display:grid;grid-template-columns:1fr 300px;gap:16px}
.bar2{height:8px;background:var(--line);border-radius:8px;overflow:hidden;flex:1}.bar2 i{display:block;height:100%;background:var(--ok)}
.qt{font-size:17px;font-weight:600;line-height:1.5;margin:14px 0}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;background:var(--card)}
.opt.on{border-color:var(--blue);background:rgba(26,95,224,.1)}
.dot{width:18px;height:18px;border:2px solid var(--mut);border-radius:50%;flex:none}.opt.on .dot{border:5px solid var(--blue)}
.tmr b{font-size:28px;color:var(--blue);display:block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 0;cursor:pointer;font-size:12px}
.grid .d{background:var(--ok);color:#fff;border-color:var(--ok)}.grid .c{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.center{max-width:480px;margin:8vh auto;text-align:center}.center h2{margin:10px 0}
.big{font-size:54px;font-weight:700;color:var(--blue)}
@media(max-width:860px){.split{grid-template-columns:1fr}.hero{padding:22px 18px}.hero em{margin-top:4px}
#app{grid-template-columns:1fr}aside{position:fixed;left:-250px;width:240px;z-index:8;transition:left .2s}aside.open{left:0}
#menu{display:block}.stats{grid-template-columns:1fr 1fr}.ex,.fg{grid-template-columns:1fr}.page{padding:14px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FOOT='<div class="foot">Hệ thống phần mềm @ Công an xã Thuần Trung</div>';
const emb=s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#e0a82e"/><circle cx="50" cy="50" r="34" fill="#c8202c"/><polygon points="50,24 56,42 76,42 60,54 66,74 50,62 34,74 40,54 24,42 44,42" fill="#ffd84a"/></svg>`;
const HERO=`<div class="hero">${emb(110)}<h1>CÔNG AN XÃ THUẦN TRUNG</h1><p>Hệ thống thi trắc nghiệm trực tuyến</p><em>"Kỷ cương - Trách nhiệm<br>Hiệu quả - Vì Nhân dân phục vụ"</em></div>`;
const fmt=d=>d?new Date(d).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
let AT=sessionStorage.getItem('ttadm'),V='dash',MON=null,tm=null,pl=null,S=null,K=null;
const stop=()=>{clearInterval(tm);clearInterval(pl);tm=pl=null};
async function api(a,d={}){
 const r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(AT||'')},body:JSON.stringify({a,...d})});
 const j=await r.json().catch(()=>({e:'Không kết nối được máy chủ'}));
 if(r.status===401&&AT){AT=null;sessionStorage.removeItem('ttadm');go()}
 if(!r.ok)throw new Error(j.e||'Có lỗi xảy ra');return j}
function go(){stop();if(location.hash==='#admin')AT?adminApp():adminLogin();else{K=JSON.parse(localStorage.getItem('ttx')||'null');K?attempt():home()}}
window.onhashchange=go;

/* ---------- THÍ SINH ---------- */
async function home(){
 $('#root').innerHTML=`<div class="split">${HERO}<div class="side"><form class="box" id="jf"><h2>Vào thi</h2><div class="sub">Chọn kỳ thi và nhập thông tin của bạn</div><div id="ex" class="sub">Đang tải danh sách kỳ thi...</div>
 <div><label for="n">Họ và tên *</label><input id="n" maxlength="80"></div><div><label for="u">Đơn vị</label><input id="u" maxlength="80" placeholder="Ví dụ: Công an xã"></div><div><label for="p">Số điện thoại *</label><input id="p" inputmode="tel" maxlength="20"></div>
 <div class="err" id="er"></div><button class="btn" id="go">Vào thi</button><div class="sub"><a href="#admin" style="color:var(--mut)">Đăng nhập quản trị</a></div></form>${FOOT}</div></div>`;
 try{const L=await api('exams');
  $('#ex').className='';$('#ex').innerHTML=L.length?L.map((e,i)=>`<label class="pick"><input type="radio" name="e" value="${e.id}" ${i?'':'checked'}><span><b>${esc(e.name)}</b><small>${e.mode==='live'?'Thi đồng loạt - bắt đầu khi quản trị mở thi':'Thi tự do - làm bất cứ lúc nào'} · ${e.dur} phút · ${e.cnt} câu</small></span></label>`).join(''):'<div class="sub">Hiện chưa có kỳ thi nào đang mở.</div>';
  if(!L.length)$('#go').disabled=true;
 }catch(e){$('#ex').textContent=e.message}
 $('#jf').onsubmit=async ev=>{ev.preventDefault();const r=document.querySelector('input[name=e]:checked');if(!r)return;$('#er').textContent='';
  try{const k=await api('join',{eid:+r.value,name:$('#n').value,unit:$('#u').value,phone:$('#p').value});localStorage.setItem('ttx',JSON.stringify(k));K=k;attempt()}catch(e){$('#er').textContent=e.message}}
}
function attempt(){
 stop();S={s:''};load();pl=setInterval(load,6000);
}
async function load(){
 try{const s=await api('state',{...K,light:S.s==='run'});
  if(s.s==='run'){const first=S.s!=='run';S.off=s.now-Date.now();S.dl=s.dl;if(first){S={s:'run',qs:s.qs,ans:s.ans,i:0,off:S.off,dl:s.dl,name:s.exam};exam();clearInterval(tm);tm=setInterval(tick,1000)}}
  else if(s.s==='wait'){S.s='wait';$('#root').innerHTML=`<div class="center card"><div>${emb(70)}</div><h2>${esc(s.exam)}</h2><p>Bạn đã vào phòng chờ. Kỳ thi sẽ tự bắt đầu khi quản trị viên mở thi.</p><p class="sub" style="margin-top:10px">Đã có ${s.n} thí sinh trong phòng</p></div>${FOOT}`}
  else{stop();const d=s.s==='done';$('#root').innerHTML=`<div class="center card"><h2>${esc(s.exam||'')}</h2>${d?`<p>Bài thi đã được nộp. Điểm của bạn</p><div class="big">${s.score}</div><span class="tag ${s.ok?'tg':'tr'}">${s.ok?'Đạt':'Không đạt'}</span>`:'<p>Kỳ thi đã kết thúc.</p>'}<div style="margin-top:20px"><button class="btn" id="hm">Về trang chủ</button></div></div>${FOOT}`;
   $('#hm').onclick=()=>{localStorage.removeItem('ttx');K=null;home()}}
 }catch(e){if(/không hợp lệ|Không tìm thấy/.test(e.message)){stop();localStorage.removeItem('ttx');home()}}
}
function tick(){const s=Math.max(0,Math.round((S.dl-(Date.now()+S.off))/1000)),el=$('#tm');
 if(el)el.textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':');if(s<=0){clearInterval(tm);load()}}
function exam(){
 const n=S.qs.length,q=S.qs[S.i],da=Object.keys(S.ans).length;
 $('#root').innerHTML=`<div style="background:var(--navy);color:#fff;padding:10px 20px;display:flex;gap:12px;align-items:center">${emb(34)}<div><b>CÔNG AN XÃ THUẦN TRUNG</b><div style="font-size:12px;opacity:.85">${esc(S.name)}</div></div></div>
 <div class="page"><div class="ex"><div class="card"><div class="row" style="margin:0"><b style="white-space:nowrap">Câu hỏi ${S.i+1} / ${n}</b><div class="bar2"><i style="width:${(S.i+1)/n*100}%"></i></div></div>
 <div class="qt">${esc(q.q)}</div>${q.o.map((o,i)=>`<button class="opt ${S.ans[S.i]===i?'on':''}" data-o="${i}"><span class="dot"></span><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}
 <div class="row"><button class="btn o" id="pv" ${S.i?'':'disabled'}>‹ Câu trước</button><button class="btn" id="nx" ${S.i<n-1?'':'disabled'}>Câu tiếp ›</button></div></div>
 <div><div class="card tmr"><span class="sub" style="text-align:left;display:block;font-size:12px">Thời gian còn lại</span><b id="tm">--:--:--</b><div style="margin-top:8px;font-size:12px;color:var(--mut)">Đã làm: ${da} · Chưa làm: ${n-da}</div></div>
 <div class="card"><b>Danh sách câu hỏi</b><div class="grid">${S.qs.map((_,i)=>`<button data-g="${i}" class="${i===S.i?'c':S.ans[i]!=null?'d':''}">${i+1}</button>`).join('')}</div></div><button class="btn" style="width:100%" id="sub">Nộp bài</button></div></div></div>${FOOT}`;
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const v=+b.dataset.o;S.ans[S.i]=v;api('answer',{...K,i:S.i,v}).catch(()=>{});exam();tick()});
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.g;exam();tick()});
 $('#pv').onclick=()=>{S.i--;exam();tick()};$('#nx').onclick=()=>{S.i++;exam();tick()};
 $('#sub').onclick=async()=>{if(confirm(`Bạn đã làm ${da}/${n} câu. Nộp bài ngay?`)){try{await api('submit',K);load()}catch(e){alert(e.message)}}};tick();
}

/* ---------- QUẢN TRỊ ---------- */
function adminLogin(){
 $('#root').innerHTML=`<div class="split">${HERO}<div class="side"><form class="box" id="lf"><h2>Đăng nhập hệ thống</h2><div class="sub">Dành cho quản trị viên</div><div><label for="u">Tên đăng nhập</label><input id="u" autocomplete="username"></div><div><label for="p">Mật khẩu</label><input id="p" type="password" autocomplete="current-password"></div><div class="err" id="er"></div><button class="btn">Đăng nhập</button><div class="sub"><a href="#" style="color:var(--mut)">Về trang thi</a></div></form>${FOOT}</div></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();try{const r=await api('login',{u:$('#u').value.trim(),p:$('#p').value});AT=r.token;sessionStorage.setItem('ttadm',AT);V='dash';adminApp()}catch(x){$('#er').textContent=x.message}}
}
const NAV=[['dash','🏠','Trang chủ'],['exams','📋','Quản lý kỳ thi'],['bank','📚','Ngân hàng câu hỏi'],['res','✅','Kết quả thi']];
function adminApp(){
 stop();
 $('#root').innerHTML=`<div id="app"><aside id="sb"><div class="brand">${emb(38)}<span>CÔNG AN XÃ<br>THUẦN TRUNG</span></div><nav>${NAV.map(x=>`<a class="${V===x[0]||(V==='mon'&&x[0]==='exams')?'on':''}" data-v="${x[0]}" tabindex="0">${x[1]} ${x[2]}</a>`).join('')}</nav><nav style="flex:none"><a id="out">🚪 Đăng xuất</a></nav></aside><main><div class="top"><button id="menu" aria-label="Menu">☰</button><span></span><b>Quản trị viên</b></div><div class="page" id="pg"></div>${FOOT}</main></div>`;
 document.querySelectorAll('nav a[data-v]').forEach(a=>a.onclick=()=>{V=a.dataset.v;adminApp()});
 $('#out').onclick=()=>{AT=null;sessionStorage.removeItem('ttadm');adminLogin()};
 $('#menu').onclick=()=>$('#sb').classList.toggle('open');
 ({dash,exams,bank,res,mon})[V]().catch(e=>$('#pg').innerHTML=`<div class="card err">${esc(e.message)}</div>`);
}
const P=h=>{const p=$('#pg');if(p)p.innerHTML=h};
const tbl=(h,r)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r||`<tr><td colspan="${h.length}" style="text-align:center;color:var(--mut)">Chưa có dữ liệu.</td></tr>`}</tbody></table></div>`;
async function dash(){
 const d=await api('dash'),av=d.avg==null?'-':Math.round(d.avg*10)/10;
 P(`<h2>Tổng quan hệ thống</h2><div class="stats"><div class="stat" style="background:#1a8cff"><b>${d.run}</b><span>Kỳ thi đang mở</span></div><div class="stat" style="background:#12a566"><b>${d.att}</b><span>Lượt thí sinh tham gia</span></div><div class="stat" style="background:#f5a623"><b>${d.qn}</b><span>Câu hỏi trong ngân hàng</span></div><div class="stat" style="background:#7a4ee0"><b>${d.done}</b><span>Bài đã nộp</span></div></div>
 <div class="card"><b>Thống kê kết quả</b><p style="margin-top:8px;color:var(--mut)">Đạt: ${d.pass}/${d.done} bài · Điểm trung bình: ${av}</p></div>
 <div class="card"><b>Link cho thí sinh</b><p style="margin-top:8px">Gửi đường link này cho thí sinh: <b>${esc(location.origin)}</b></p></div>`);
}
const lab=e=>{const n=Date.now();if(e.mode==='live')return e.status==='waiting'?['Phòng chờ','ty']:e.status==='running'&&e.en>n?['Đang thi','tg']:['Đã kết thúc','tx'];return e.status==='open'?['Đang mở','tg']:['Đã đóng','tx']};
const canStart=e=>e.mode==='live'?e.status==='waiting':e.status!=='open';
const canEnd=e=>e.mode==='live'?(e.status==='running'&&e.en>Date.now()):e.status==='open';
async function exams(){
 const L=await api('el');
 P(`<h2>Quản lý kỳ thi</h2><div class="card"><div class="tools"><span style="flex:1;color:var(--mut)">Tổng: ${L.length} kỳ thi</span><button class="btn" id="add">+ Tạo kỳ thi mới</button></div>${tbl(['Tên kỳ thi','Chế độ','Làm bài','Trạng thái','Thí sinh','Thao tác'],L.map(e=>{const s=lab(e);return`<tr><td>${esc(e.name)}</td><td>${e.mode==='live'?'Đồng loạt':'Tự do'}</td><td>${e.dur} phút / ${e.cnt} câu</td><td><span class="tag ${s[1]}">${s[0]}</span></td><td>${e.n}</td><td style="white-space:nowrap">${canStart(e)?`<button class="btn s g" data-s="${e.id}">${e.mode==='live'?'Bắt đầu thi':'Mở'}</button> `:''}${canEnd(e)?`<button class="btn s r" data-x="${e.id}">${e.mode==='live'?'Kết thúc':'Đóng'}</button> `:''}<button class="btn s o" data-m="${e.id}">Theo dõi</button><button class="ic" data-d="${e.id}" aria-label="Xóa">🗑️</button></td></tr>`}).join(''))}</div>`);
 $('#add').onclick=()=>modal('Tạo kỳ thi mới',[{k:'name',l:'Tên kỳ thi *',w:1},{k:'mode',l:'Chế độ thi',t:'sel',o:['Thi tự do (làm bất cứ lúc nào)','Thi đồng loạt (admin bắt đầu / kết thúc)'],v:['free','live'],w:1},{k:'dur',l:'Thời gian làm bài (phút)',t:'number'},{k:'cnt',l:'Số câu hỏi',t:'number'},{k:'t1',l:'Mở từ (tùy chọn, thi tự do)',t:'datetime-local'},{k:'t2',l:'Đóng lúc (tùy chọn, thi tự do)',t:'datetime-local'}],{dur:30,cnt:10},o=>api('es',{...o,t1:o.t1?new Date(o.t1).getTime():null,t2:o.t2?new Date(o.t2).getTime():null}));
 const act=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=async()=>{try{await fn(b)}catch(e){alert(e.message)}adminApp()});
 act('[data-s]',b=>api('start',{id:+b.dataset.s}));
 act('[data-x]',b=>confirm('Kết thúc kỳ thi? Các bài đang làm sẽ được nộp và chấm ngay.')?api('end',{id:+b.dataset.x}):0);
 act('[data-d]',b=>confirm('Xóa kỳ thi và toàn bộ bài làm của kỳ thi này?')?api('ed',{id:+b.dataset.d}):0);
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{MON=+b.dataset.m;V='mon';adminApp()});
}
async function mon(){
 const draw=async()=>{try{const {e,at}=await api('mon',{id:MON}),s=lab(e),dn=at.filter(x=>x.done).length;
  P(`<div class="tools"><button class="btn s o" id="bk">‹ Quay lại</button><h2 style="margin:0;flex:1">${esc(e.name)}</h2><span class="tag ${s[1]}">${s[0]}</span>${canStart(e)?`<button class="btn s g" id="st">${e.mode==='live'?'Bắt đầu thi':'Mở'}</button>`:''}${canEnd(e)?`<button class="btn s r" id="en">${e.mode==='live'?'Kết thúc':'Đóng'}</button>`:''}${e.mode==='live'&&canEnd(e)?'<button class="btn s o" id="ex5">+5 phút</button>':''}</div>
  <div class="stats"><div class="stat" style="background:#1a8cff"><b>${at.length}</b><span>Đã vào phòng thi</span></div><div class="stat" style="background:#f5a623"><b>${at.length-dn}</b><span>Đang làm / chờ</span></div><div class="stat" style="background:#12a566"><b>${dn}</b><span>Đã nộp</span></div><div class="stat" style="background:#7a4ee0"><b>${at.filter(x=>x.ok).length}</b><span>Đạt</span></div></div>
  <div class="card">${tbl(['Họ và tên','Đơn vị','SĐT','Tiến độ','Trạng thái','Điểm'],at.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${esc(x.phone)}</td><td>${x.total?x.got+'/'+x.total:'-'}</td><td><span class="tag ${x.done?(x.ok?'tg':'tr'):x.total?'tb':'ty'}">${x.done?(x.ok?'Đạt':'Không đạt'):x.total?'Đang làm':'Chờ'}</span></td><td>${x.done?x.score:''}</td></tr>`).join(''))}</div>`);
  $('#bk').onclick=()=>{V='exams';adminApp()};
  if($('#ex5'))$('#ex5').onclick=async()=>{try{await api('ext',{id:MON,m:5});draw()}catch(x){alert(x.message)}};
  if($('#st'))$('#st').onclick=async()=>{await api('start',{id:MON});draw()};
  if($('#en'))$('#en').onclick=async()=>{if(confirm('Kết thúc kỳ thi? Các bài đang làm sẽ được nộp và chấm ngay.')){await api('end',{id:MON});draw()}};
 }catch(e){P(`<div class="card err">${esc(e.message)}</div>`)}};
 await draw();pl=setInterval(draw,5000);
}
async function bank(){
 const L=await api('ql');
 P(`<h2>Ngân hàng câu hỏi</h2><div class="card"><div class="tools"><span style="flex:1;color:var(--mut)">Tổng: ${L.length} câu hỏi</span><button class="btn o" id="imp">Nhập hàng loạt</button><button class="btn" id="add">+ Thêm câu hỏi</button></div>${tbl(['STT','Nội dung câu hỏi','Môn học','Mức độ','Thao tác'],L.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.q)}</td><td>${esc(x.subj)}</td><td>${esc(x.lvl)}</td><td style="white-space:nowrap"><button class="ic" data-e="${x.id}" aria-label="Sửa">✏️</button><button class="ic" data-d="${x.id}" aria-label="Xóa">🗑️</button></td></tr>`).join(''))}</div>`);
 const F=[{k:'q',l:'Nội dung câu hỏi *',t:'ta',w:1},...'ABCD'.split('').map((c,i)=>({k:'o'+i,l:'Đáp án '+c+(i<2?' *':'')})),{k:'a',l:'Đáp án đúng',t:'sel',o:['A','B','C','D'],v:[0,1,2,3]},{k:'subj',l:'Môn học'},{k:'lvl',l:'Mức độ',t:'sel',o:['Dễ','Trung bình','Khó']}];
 const sv=id=>o=>api('qs',{id,q:o.q,o:[o.o0,o.o1,o.o2,o.o3].filter(Boolean),a:o.a,subj:o.subj||'Pháp luật',lvl:o.lvl});
 $('#add').onclick=()=>modal('Thêm câu hỏi',F,{subj:'Pháp luật'},sv(0));
 $('#imp').onclick=()=>modal('Nhập hàng loạt',[{k:'t',l:'Mỗi dòng 1 câu: Câu hỏi | A | B | C | D | Đáp án đúng (A-D) | Môn | Mức độ',t:'ta',w:1}],{},async o=>{
  const list=o.t.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(c=>c.length>=6&&c[0]).map(c=>({q:c[0],o:c.slice(1,5),a:'ABCD'.indexOf((c[5]||'').toUpperCase()),s:c[6],l:c[7]}));
  if(!list.length)throw new Error('Không đọc được dòng nào. Cần: Câu hỏi | A | B | C | D | Đáp án');
  const r=await api('qi',{list});alert('Đã nhập '+r.n+'/'+list.length+' câu hỏi')});
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const x=L.find(k=>k.id==b.dataset.e);modal('Sửa câu hỏi',F,{q:x.q,o0:x.o[0],o1:x.o[1],o2:x.o[2],o3:x.o[3],a:x.a,subj:x.subj,lvl:x.lvl},sv(x.id))});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa câu hỏi này?')){await api('qd',{id:+b.dataset.d});adminApp()}});
}
async function res(){
 const L=await api('res');
 P(`<h2>Kết quả thi</h2><div class="card"><div class="tools"><span style="flex:1;color:var(--mut)">Tổng: ${L.length} kết quả</span><button class="btn o" id="csv">Xuất CSV</button></div>${tbl(['STT','Họ và tên','Đơn vị','Kỳ thi','Điểm','Nộp lúc','Kết quả'],L.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${esc(x.exam)}</td><td>${x.score}</td><td>${fmt(x.sub)}</td><td><span class="tag ${x.ok?'tg':'tr'}">${x.ok?'Đạt':'Không đạt'}</span></td></tr>`).join(''))}</div>`);
 $('#csv').onclick=()=>{const c='\ufeffHọ tên,Đơn vị,SĐT,Kỳ thi,Điểm,Nộp lúc,Kết quả\n'+L.map(x=>[x.name,x.unit,x.phone,x.exam,x.score,fmt(x.sub),x.ok?'Đạt':'Không đạt'].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='ket-qua-thi.csv';a.click()};
}
function modal(title,fields,vals,ok){
 const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div role="dialog"><h3>${title}</h3><form class="fg">${fields.map(f=>`<div class="${f.w?'w':''}"><label>${f.l}</label>${f.t==='sel'?`<select name="${f.k}">${f.o.map((o,i)=>`<option value="${f.v?f.v[i]:o}">${o}</option>`).join('')}</select>`:f.t==='ta'?`<textarea name="${f.k}" rows="3"></textarea>`:`<input name="${f.k}" type="${f.t||'text'}">`}</div>`).join('')}<div class="act w"><span class="err" id="me" style="margin-right:auto"></span><button type="button" class="btn o" id="mc">Hủy</button><button class="btn">Lưu</button></div></form></div>`;
 document.body.appendChild(m);const f=m.querySelector('form');
 fields.forEach(x=>{if(vals&&vals[x.k]!=null)f.elements[x.k].value=vals[x.k]});
 m.querySelector('#mc').onclick=()=>m.remove();
 f.onsubmit=async e=>{e.preventDefault();const o={};fields.forEach(x=>o[x.k]=f.elements[x.k].value.trim());
  try{await ok(o);m.remove();adminApp()}catch(x){m.querySelector('#me').textContent=x.message}}
}
go();
</script>
</body>
</html>
