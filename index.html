<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hệ thống thi trắc nghiệm trực tuyến - Công an xã Thuần Trung</title>
<style>
:root{--menu:#0a2a6e;--blue:#1a5fe0;--bg:#f3f6fc;--line:#e3e9f5;--tx:#16233f;--mut:#6b7a99;--ok:#18a05a;--bad:#e5484d;--card:#fff;--r:12px;--fs:14px;--ff:Inter,"Segoe UI",Roboto,Arial,sans-serif;--hz:1.04;--hzb:1.013}
@media(prefers-color-scheme:dark){:root:not([data-c]){--bg:#0e1626;--line:#24324f;--tx:#e6ecf9;--mut:#93a2c4;--card:#15203a}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);font-size:var(--fs);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:.65em .8em;border:1px solid var(--line);border-radius:var(--r);background:var(--card);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent);outline:0}
input[type=color]{padding:3px;height:2.6em;cursor:pointer}input[type=range]{padding:0;accent-color:var(--blue)}input[type=checkbox]{width:auto}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:var(--r);padding:.65em 1.2em;cursor:pointer;font-weight:600}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--line)}.btn.s{padding:.4em .85em;font-size:.86em}.btn.r{background:var(--bad)}.btn.g{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
.btn,.opt,.pick,.stat,.grid button,nav a,.tag,.ic,.card,.wi{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s,border-color .2s}
html[data-z] :is(.btn,.opt,.pick,.stat,.grid button,nav a,.ic,.tag,.wi):not(:disabled):hover{transform:scale(var(--hz));position:relative;z-index:2}
html[data-z] .card:hover{transform:scale(var(--hzb));box-shadow:0 12px 32px rgba(10,30,80,.13);position:relative;z-index:1}
.pick:hover,.opt:hover{border-color:var(--blue)}tbody tr:hover{background:color-mix(in srgb,var(--blue) 6%,transparent)}
.foot{text-align:center;color:var(--mut);font-size:.86em;padding:18px 10px}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--menu) 90%,transparent),color-mix(in srgb,var(--menu) 72%,transparent)),var(--hi,none),var(--menu);background-size:cover;background-position:center;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.hero h1{font-size:1.6em}.hero em{margin-top:22px;font-size:1.15em;line-height:1.7}
.side{display:flex;flex-direction:column;justify-content:space-between;background:var(--card)}
.box{max-width:420px;width:100%;margin:auto;padding:28px 22px;display:flex;flex-direction:column;gap:12px}
.fm{display:flex;flex-direction:column;gap:12px;animation:up .3s backwards}.fm[hidden]{display:none}
.box h2{text-align:center;font-size:1.5em}.sub{text-align:center;color:var(--mut)}
.box label,.fg label,.fm label{font-size:.86em;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.err{color:var(--bad);font-size:.86em;min-height:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:var(--r);padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:.6em;border-radius:calc(var(--r) - 3px);cursor:pointer;font-weight:600;color:var(--mut);transition:all .2s}.tabs .on{background:var(--card);color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pw{position:relative}.pw input{padding-right:2.8em}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:1.15em;padding:4px 8px;border-radius:var(--r)}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--menu),color-mix(in srgb,var(--menu) 82%,#000));color:#fff;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px;font-weight:700;font-size:.93em;line-height:1.25}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav a{display:flex;gap:10px;padding:.75em .9em;border-radius:var(--r);color:#d6e0fa;cursor:pointer;font-size:.93em}
nav a:hover{background:rgba(255,255,255,.1)}nav a.on{background:var(--blue);color:#fff;font-weight:600}
main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line)}
#menu{display:none;background:none;border:0;font-size:22px;cursor:pointer}
.page{padding:22px;flex:1}.page h2{font-size:1.3em;margin-bottom:16px}
.page.in>*{animation:up .38s cubic-bezier(.2,.8,.2,1) backwards}.page.in>*:nth-child(2){animation-delay:.05s}.page.in>*:nth-child(3){animation-delay:.1s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{border-radius:var(--r);color:#fff;padding:16px 18px;display:flex;flex-direction:column}.stat b{font-size:2em}.stat span{font-size:.86em;opacity:.92}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools>input,.tools>select{flex:1;min-width:130px}
.tw{overflow-x:auto;border-radius:var(--r)}table{width:100%;border-collapse:collapse}
th{background:var(--bg);text-align:left;padding:10px;font-size:.86em;color:var(--mut)}td{padding:10px;border-top:1px solid var(--line)}
.tag{padding:3px 10px;border-radius:99px;font-size:.8em;font-weight:600;white-space:nowrap;display:inline-block}
.tg{background:#dcf5e8;color:#0d7a42}.ty{background:#fdf0d4;color:#9a6200}.tr{background:#fde2e3;color:#b3262b}.tb{background:#dde8fd;color:#1b4fb8}.tx{background:#e8ebf2;color:#51607f}
.ic{background:none;border:0;cursor:pointer;font-size:1.1em;padding:2px 6px;border-radius:var(--r)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w{grid-column:1/-1}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.cg .card{margin:0}.ex1{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mod{position:fixed;inset:0;background:rgba(5,15,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;animation:fd .2s;backdrop-filter:blur(3px)}
.mod.out{opacity:0;transition:opacity .2s}
.mod>div{background:var(--card);border-radius:calc(var(--r) + 2px);padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto;animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}.mod>.wide{max-width:780px}
.mod h3{margin-bottom:14px}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;align-items:center}
.wq{max-height:42vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.wi{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:3px}.wi select{margin-top:6px;max-width:220px}.rt{color:var(--ok);font-weight:700}
.ex{display:grid;grid-template-columns:1fr 300px;gap:16px}
.bar2{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}.bar2 i{display:block;height:100%;background:var(--ok);transition:width .4s}
.qt{font-size:1.2em;font-weight:600;line-height:1.5;margin:14px 0}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;cursor:pointer;width:100%;text-align:left;background:var(--card)}
.opt.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent)}
.dot{width:18px;height:18px;border:2px solid var(--mut);border-radius:50%;flex:none;transition:border .15s}.opt.on .dot{border:5px solid var(--blue)}
.tmr b{font-size:2em;color:var(--blue);display:block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:calc(var(--r)/2);padding:7px 0;cursor:pointer;font-size:.86em}
.grid .d{background:var(--ok);color:#fff;border-color:var(--ok)}.grid .c{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.center{max-width:480px;margin:8vh auto;text-align:center;animation:up .4s backwards}.center h2{margin:10px 0}
.big{font-size:54px;font-weight:700;color:var(--blue)}
.pick{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;margin-bottom:8px}
#tw{position:fixed;top:14px;right:14px;z-index:20;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--card);border-left:4px solid var(--ok);padding:12px 16px;border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:320px;animation:sl .4s cubic-bezier(.2,.9,.3,1.1)}
.toast.er{border-color:var(--bad)}.toast.out{animation:slo .35s forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes fd{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes sl{from{opacity:0;transform:translateX(120%)}}@keyframes slo{to{opacity:0;transform:translateX(120%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){.split{grid-template-columns:1fr}.hero{padding:22px 18px}.hero em{margin-top:4px}
#app{grid-template-columns:1fr}aside{position:fixed;left:-250px;width:240px;z-index:8;transition:left .25s}aside.open{left:0}
#menu{display:block}.stats{grid-template-columns:1fr 1fr}.ex,.fg{grid-template-columns:1fr}.page{padding:14px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FOOT='<div class="foot">Hệ thống phần mềm @ Công an xã Thuần Trung</div>';
const fmt=d=>d?new Date(d).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
/* ---------- GIAO DIỆN TUỲ CHỈNH ---------- */
const FF0='Inter,"Segoe UI",Roboto,Arial,sans-serif';
const DT={menu:'#0a2a6e',acc:'#1a5fe0',bg:'#f3f6fc',ff:'',fs:14,r:12,hz:1.04,zoom:1,logo:'',hero:''};
const FF={'Mặc định':'','Arial':'Arial,Helvetica,sans-serif','Tahoma':'Tahoma,Geneva,sans-serif','Times New Roman':'"Times New Roman",serif','Georgia':'Georgia,serif','Verdana':'Verdana,sans-serif','Trebuchet':'"Trebuchet MS",sans-serif'};
let T,SAVED;
function theme(t){T=t;const d=document.documentElement,s=d.style;s.setProperty('--menu',t.menu);s.setProperty('--blue',t.acc);
 if(t.bg.toLowerCase()!==DT.bg){s.setProperty('--bg',t.bg);d.dataset.c=1}else{s.removeProperty('--bg');delete d.dataset.c}
 s.setProperty('--ff',t.ff||FF0);s.setProperty('--fs',t.fs+'px');s.setProperty('--r',t.r+'px');s.setProperty('--hz',t.hz);s.setProperty('--hzb',1+(t.hz-1)/3);
 t.zoom?d.dataset.z=1:delete d.dataset.z;
 t.hero?s.setProperty('--hi','url("'+t.hero.replace(/"/g,'%22')+'")'):s.removeProperty('--hi')}
try{SAVED={...DT,...JSON.parse(localStorage.getItem('ttth')||'{}')}}catch(e){SAVED={...DT}}
theme(SAVED);
const lg=s=>T.logo?`<img src="${esc(T.logo)}" width="${s}" height="${s}" style="object-fit:contain;border-radius:var(--r)" alt="">`:`<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#e0a82e"/><circle cx="50" cy="50" r="34" fill="#c8202c"/><polygon points="50,24 56,42 76,42 60,54 66,74 50,62 34,74 40,54 24,42 44,42" fill="#ffd84a"/></svg>`;
const emb=s=>`<span class="lg" data-s="${s}" style="display:inline-flex">${lg(s)}</span>`;
const relogo=()=>document.querySelectorAll('.lg').forEach(e=>e.innerHTML=lg(+e.dataset.s));
const HERO=()=>`<div class="hero">${emb(110)}<h1>CÔNG AN XÃ THUẦN TRUNG</h1><p>Hệ thống thi trắc nghiệm trực tuyến</p><em>"Kỷ cương - Trách nhiệm<br>Hiệu quả - Vì Nhân dân phục vụ"</em></div>`;
/* ---------- TIỆN ÍCH ---------- */
const tw=document.body.appendChild(Object.assign(document.createElement('div'),{id:'tw'}));
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;tw.appendChild(e);setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),350)},3200)}
const ask=m=>new Promise(r=>{const o=document.createElement('div');o.className='mod';o.innerHTML=`<div role="dialog"><p style="margin:4px 0 18px;line-height:1.5">${esc(m)}</p><div class="act"><button class="btn o" data-n>Hủy</button><button class="btn" data-y>Đồng ý</button></div></div>`;document.body.appendChild(o);const c=v=>{o.classList.add('out');setTimeout(()=>o.remove(),200);r(v)};o.querySelector('[data-n]').onclick=()=>c(false);o.querySelector('[data-y]').onclick=()=>c(true)});
const PW=(id,l,ac)=>`<div><label for="${id}">${l}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac||'current-password'}"><button type="button" class="eye" aria-label="Hiện/ẩn mật khẩu">👁</button></div></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('.eye');if(!b)return;const i=b.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'🙈':'👁'});
const digits=i=>i.oninput=()=>i.value=i.value.replace(/\D/g,'');
const ADMA=new Set('dash ql qs qd el es ed start end mon res ext qi ainfo apw thset'.split(' ')),USRA=new Set(['join','me','mset','mpw','myex']);
let AT=sessionStorage.getItem('ttadm'),UT=localStorage.getItem('ttu'),V='',MON=null,tm=null,pl=null,S=null,K=null,CA={};
const stop=()=>{clearInterval(tm);clearInterval(pl);tm=pl=null};
async function api(a,d={},keep){
 if(!keep)CA={};
 const tk=ADMA.has(a)?AT:USRA.has(a)?UT:'';
 const r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tk||'')},body:JSON.stringify({a,...d})});
 const j=await r.json().catch(()=>({e:'Không kết nối được máy chủ'}));
 if(r.status===401){if(ADMA.has(a)&&AT){AT=null;sessionStorage.removeItem('ttadm');go()}if(USRA.has(a)&&UT){UT=null;localStorage.removeItem('ttu');go()}}
 if(!r.ok)throw new Error(j.e||'Có lỗi xảy ra');return j}
/* hiện ngay dữ liệu đã lưu, tải mới ở nền rồi cập nhật nếu thay đổi → chuyển trang rất nhanh */
async function swr(k,fn,render){const c=CA[k];if(c)render(c);const x=await fn();if(JSON.stringify(x)!==JSON.stringify(c)){CA[k]=x;render(x)}}
const P=h=>{const p=$('#pg');if(p)p.innerHTML=h};
const fail=e=>P(`<div class="card err">${esc(e.message)}</div>`);
function go(){stop();K=null;
 if(location.hash==='#admin'){AT?app():adminLogin();return}
 try{K=JSON.parse(localStorage.getItem('ttx')||'null')}catch(e){}
 if(!UT){localStorage.removeItem('ttx');home()}else if(K)attempt();else app()}
window.onhashchange=go;
api('theme',{},1).then(t=>{if(t&&Object.keys(t).length){const n={...DT,...t};if(JSON.stringify(n)!==JSON.stringify(SAVED)){SAVED=n;theme(n);relogo();try{localStorage.setItem('ttth',JSON.stringify(n))}catch(e){}}}}).catch(()=>{});

/* ---------- ĐĂNG NHẬP / ĐĂNG KÝ THÍ SINH ---------- */
function home(){
 $('#root').innerHTML=`<div class="split">${HERO()}<div class="side"><div class="box"><h2>Cổng thi trực tuyến</h2><div class="tabs"><button class="on" data-t="l">Đăng nhập</button><button data-t="r">Đăng ký</button></div>
 <form class="fm" id="lf"><div><label for="lc">Số căn cước công dân (12 số)</label><input id="lc" inputmode="numeric" maxlength="12" autocomplete="username"></div>${PW('lp','Mật khẩu')}<div class="err" id="le"></div><button class="btn">Đăng nhập</button></form>
 <form class="fm" id="rf" hidden><div><label for="rc">Số căn cước công dân (12 số) *</label><input id="rc" inputmode="numeric" maxlength="12"></div><div><label for="rn">Họ và tên *</label><input id="rn" maxlength="80"></div><div><label for="ru">Đơn vị</label><input id="ru" maxlength="80" placeholder="Ví dụ: Công an xã"></div><div><label for="rt">Số điện thoại</label><input id="rt" inputmode="tel" maxlength="20"></div>${PW('rp','Đặt mật khẩu (tối thiểu 6 ký tự) *','new-password')}${PW('rq','Nhập lại mật khẩu *','new-password')}<div class="err" id="re"></div><button class="btn">Tạo tài khoản</button></form>
 <div class="sub"><a href="#admin" style="color:var(--mut)">Đăng nhập quản trị</a></div></div>${FOOT}</div></div>`;
 digits($('#lc'));digits($('#rc'));
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{const l=b.dataset.t==='l';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#lf').hidden=!l;$('#rf').hidden=l});
 const fin=r=>{UT=r.token;localStorage.setItem('ttu',UT);CA={};V='';app()};
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';try{fin(await api('ulogin',{cccd:$('#lc').value,pw:$('#lp').value}))}catch(x){$('#le').textContent=x.message}};
 $('#rf').onsubmit=async e=>{e.preventDefault();$('#re').textContent='';if($('#rp').value!==$('#rq').value){$('#re').textContent='Mật khẩu nhập lại không khớp';return}
  try{fin(await api('reg',{cccd:$('#rc').value,name:$('#rn').value,unit:$('#ru').value,phone:$('#rt').value,pw:$('#rp').value}))}catch(x){$('#re').textContent=x.message}};
}

/* ---------- KHUNG ỨNG DỤNG DÙNG CHUNG ---------- */
const NAVS={a:[['dash','🏠','Trang chủ'],['exams','📋','Quản lý kỳ thi'],['bank','📚','Ngân hàng câu hỏi'],['res','✅','Kết quả thi'],['theme','🎨','Giao diện'],['acct','🔐','Tài khoản admin']],
 u:[['uex','📋','Kỳ thi'],['umy','🏅','Kỳ thi của tôi'],['upf','👤','Hồ sơ của tôi']]};
function app(v){
 stop();const k=location.hash==='#admin'?'a':'u',N=NAVS[k];if(v)V=v;if(!N.some(x=>x[0]===V)&&V!=='mon')V=N[0][0];
 if(!$('#app')||$('#app').dataset.k!==k){
  $('#root').innerHTML=`<div id="app" data-k="${k}"><aside id="sb"><div class="brand">${emb(38)}<span>CÔNG AN XÃ<br>THUẦN TRUNG</span></div><nav>${N.map(x=>`<a data-v="${x[0]}" tabindex="0" role="button">${x[1]} ${x[2]}</a>`).join('')}</nav><nav style="flex:none"><a id="out" tabindex="0" role="button">🚪 Đăng xuất</a></nav></aside><main><div class="top"><button id="menu" aria-label="Menu">☰</button><span></span><b id="who">${k==='a'?'Quản trị viên':'Thí sinh'}</b></div><div class="page" id="pg"></div>${FOOT}</main></div>`;
  document.querySelectorAll('nav a[data-v]').forEach(a=>a.onclick=()=>{$('#sb').classList.remove('open');app(a.dataset.v)});
  $('#out').onclick=()=>{CA={};if(k==='a'){AT=null;sessionStorage.removeItem('ttadm');adminLogin()}else{UT=null;localStorage.removeItem('ttu');localStorage.removeItem('ttx');home()}};
  $('#menu').onclick=()=>$('#sb').classList.toggle('open');
  if(k==='u')api('me',{},1).then(m=>{const w=$('#who');if(w)w.textContent=m.name}).catch(()=>{});
 }
 document.querySelectorAll('nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===V||(V==='mon'&&a.dataset.v==='exams')));
 if(V!=='theme'&&T!==SAVED){theme(SAVED);relogo()}
 const pg=$('#pg');if(pg.dataset.v!==V){pg.dataset.v=V;pg.classList.remove('in');void pg.offsetWidth;pg.classList.add('in')}
 ({dash,exams,mon,bank,res,themeV,acct,uex,umy,upf})[V]().catch(fail);
}
function adminLogin(){stop();

function wordImport(){
 let G=[];const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div role="dialog" class="wide"><h3>Thêm câu hỏi từ file Word</h3><p class="sub" style="text-align:left;margin-bottom:10px;line-height:1.5">Chọn file .docx: mỗi câu có nội dung và các đáp án A, B, C, D (mỗi đáp án một dòng). Đáp án đúng được nhận diện theo chữ <b>in đậm</b>, chữ <span style="color:#c8202c">tô màu khác</span>, highlight, hoặc dòng “Đáp án: B”.</p><input type="file" id="wf" accept=".docx"><div id="wl"></div><div class="fg" style="margin-top:12px"><div><label>Môn học</label><input id="ws" value="Pháp luật"></div><div><label>Mức độ</label><select id="wv"><option>Dễ</option><option selected>Trung bình</option><option>Khó</option></select></div></div><div class="act"><span class="err" id="we" style="margin-right:auto"></span><button class="btn o" id="wc">Đóng</button><button class="btn" id="wo" disabled>Nhập vào ngân hàng</button></div></div>`;
 document.body.appendChild(m);const q=s=>m.querySelector(s),close=()=>{m.classList.add('out');setTimeout(()=>m.remove(),200)};
 const draw=()=>{const ok=G.filter(g=>g.a>=0).length,sc=q('.wq')?q('.wq').scrollTop:0;
  q('#wl').innerHTML=`<p style="margin-top:12px"><b>${G.length}</b> câu đọc được · <span style="color:var(--ok)">${ok} đã có đáp án</span>${G.length-ok?` · <span style="color:var(--bad)">${G.length-ok} chưa rõ đáp án (chọn tay, nếu không sẽ bị bỏ qua)</span>`:''}</p><div class="wq">${G.map((g,i)=>`<div class="wi"><div><b>${i+1}.</b> ${esc(g.q)}</div>${g.o.map((o,k)=>`<div class="${g.a===k?'rt':''}">${'ABCD'[k]}. ${esc(o)}${g.a===k?' ✓':''}</div>`).join('')}<select data-i="${i}"><option value="-1">Chọn đáp án đúng…</option>${g.o.map((_,k)=>`<option value="${k}" ${g.a===k?'selected':''}>Đáp án ${'ABCD'[k]}</option>`).join('')}</select></div>`).join('')}</div>`;
  q('.wq').scrollTop=sc;q('#wo').disabled=!ok;q('#wo').textContent=ok?`Nhập ${ok} câu vào ngân hàng`:'Nhập vào ngân hàng';
  m.querySelectorAll('[data-i]').forEach(s=>s.onchange=()=>{G[+s.dataset.i].a=+s.value;draw()})};
 q('#wc').onclick=close;
 q('#wf').onchange=async e=>{const f=e.target.files[0];if(!f)return;q('#we').textContent='Đang đọc file...';try{G=await parseDocx(f);q('#we').textContent=G.length?'':'Không tìm thấy câu hỏi nào. Kiểm tra lại định dạng A. B. C. D.';if(G.length)draw()}catch(x){q('#we').textContent=x.message}};
 q('#wo').onclick=async()=>{const list=G.filter(g=>g.a>=0).map(g=>({q:g.q,o:g.o.slice(0,4),a:g.a,s:q('#ws').value.trim()||'Pháp luật',l:q('#wv').value}));
  try{const r=await api('qi',{list});close();toast('Đã nhập '+r.n+' câu hỏi vào ngân hàng');if(V==='bank'||V==='exams')app()}catch(x){q('#we').textContent=x.message}};
}

/* ---------- THÍ SINH ---------- */
const stt=m=>m.done?['Đã nộp',m.ok?'tg':'tr']:(m.mode==='live'&&(m.status==='ended'||(m.status==='running'&&m.en<=Date.now()))?['Đã kết thúc','tx']:[m.st?'Đang làm':'Chờ thi','tb']);
const uex=()=>swr('uex',()=>Promise.all([api('exams',{},1),api('myex',{},1)]),([L,M])=>{
 P(`<h2>Kỳ thi đang mở</h2>${L.length?`<div class="cg">${L.map(e=>{const a=M.find(m=>m.eid===e.id);return`<div class="card ex1"><b>${esc(e.name)}</b><span class="sub" style="text-align:left">${e.mode==='live'?'Thi đồng loạt - bắt đầu khi quản trị mở thi':'Thi tự do - làm bất cứ lúc nào'} · ${e.dur} phút · ${e.cnt} câu</span>${a&&a.done?`<span class="tag ${a.ok?'tg':'tr'}">Đã nộp · ${a.score} điểm</span>`:`<button class="btn" data-j="${e.id}">${a?'Tiếp tục thi':'Vào thi'}</button>`}</div>`}).join('')}</div>`:'<div class="card sub">Hiện chưa có kỳ thi nào đang mở.</div>'}`);
 document.querySelectorAll('[data-j]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{K=await api('join',{eid:+b.dataset.j});localStorage.setItem('ttx',JSON.stringify(K));attempt()}catch(e){toast(e.message,'er');b.disabled=false}});
});
const umy=()=>swr('umy',()=>api('myex',{},1),M=>{
 P(`<h2>Kỳ thi của tôi</h2><div class="card">${tbl(['Kỳ thi','Trạng thái','Điểm','Kết quả','Nộp lúc',''],M.map(m=>{const s=stt(m);return`<tr><td>${esc(m.name)}</td><td><span class="tag ${s[1]}">${s[0]}</span></td><td>${m.done?m.score:'-'}</td><td>${m.done?`<span class="tag ${m.ok?'tg':'tr'}">${m.ok?'Đạt':'Không đạt'}</span>`:'-'}</td><td>${fmt(m.sub)}</td><td>${!m.done&&s[1]==='tb'?`<button class="btn s" data-r="${m.aid}" data-t="${m.tok}">Tiếp tục</button>`:''}</td></tr>`}).join(''))}</div>`);
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{K={aid:b.dataset.r,tok:b.dataset.t};localStorage.setItem('ttx',JSON.stringify(K));attempt()});
});
const upf=()=>swr('me',()=>api('me',{},1),u=>{
 P(`<h2>Hồ sơ của tôi</h2><div class="cg" style="align-items:start"><div class="card"><b>Thông tin cá nhân</b><form class="fm" id="pf" style="margin-top:12px"><div><label>Số căn cước công dân</label><input value="${esc(u.cccd)}" disabled></div><div><label for="pn">Họ và tên</label><input id="pn" maxlength="80" value="${esc(u.name)}"></div><div><label for="pu">Đơn vị</label><input id="pu" maxlength="80" value="${esc(u.unit)}"></div><div><label for="pt">Số điện thoại</label><input id="pt" inputmode="tel" maxlength="20" value="${esc(u.phone)}"></div><div class="err" id="pe"></div><button class="btn">Lưu thông tin</button></form></div>
 <div class="card"><b>Đổi mật khẩu</b><form class="fm" id="wf2" style="margin-top:12px">${PW('o1','Mật khẩu hiện tại')}${PW('n1','Mật khẩu mới (tối thiểu 6 ký tự)','new-password')}${PW('n2','Nhập lại mật khẩu mới','new-password')}<div class="err" id="we2"></div><button class="btn">Đổi mật khẩu</button></form></div></div>`);
 $('#pf').onsubmit=async e=>{e.preventDefault();$('#pe').textContent='';try{await api('mset',{name:$('#pn').value,unit:$('#pu').value,phone:$('#pt').value});$('#who').textContent=$('#pn').value;toast('Đã lưu thông tin')}catch(x){$('#pe').textContent=x.message}};
 $('#wf2').onsubmit=async e=>{e.preventDefault();$('#we2').textContent='';if($('#n1').value!==$('#n2').value){$('#we2').textContent='Mật khẩu nhập lại không khớp';return}
  try{await api('mpw',{old:$('#o1').value,np:$('#n1').value});['o1','n1','n2'].forEach(i=>$('#'+i).value='');toast('Đã đổi mật khẩu')}catch(x){$('#we2').textContent=x.message}};
});
function attempt(){stop();S={s:''};load();pl=setInterval(load,6000)}
const leave=()=>{stop();localStorage.removeItem('ttx');K=null;CA={};V='';go()};
async function load(){
 try{const s=await api('state',{...K,light:S.s==='run'},1);
  if(s.s==='run'){const first=S.s!=='run';S.off=s.now-Date.now();S.dl=s.dl;if(first){S={s:'run',qs:s.qs,ans:s.ans,i:0,off:S.off,dl:s.dl,name:s.exam};exam();clearInterval(tm);tm=setInterval(tick,1000)}}
  else if(s.s==='wait'){S.s='wait';$('#root').innerHTML=`<div class="center card"><div>${emb(70)}</div><h2>${esc(s.exam)}</h2><p>Bạn đã vào phòng chờ. Kỳ thi sẽ tự bắt đầu khi quản trị viên mở thi.</p><p class="sub" style="margin:10px 0 16px">Đã có ${s.n} thí sinh trong phòng</p><button class="btn o" id="lv">Thoát phòng chờ</button></div>${FOOT}`;$('#lv').onclick=leave}
  else{stop();const d=s.s==='done';$('#root').innerHTML=`<div class="center card"><h2>${esc(s.exam||'')}</h2>${d?`<p>Bài thi đã được nộp. Điểm của bạn</p><div class="big">${s.score}</div><span class="tag ${s.ok?'tg':'tr'}">${s.ok?'Đạt':'Không đạt'}</span>`:'<p>Kỳ thi đã kết thúc.</p>'}<div style="margin-top:20px"><button class="btn" id="hm">Về trang chủ</button></div></div>${FOOT}`;
   $('#hm').onclick=()=>{V='umy';leave()}}
 }catch(e){if(/không hợp lệ|Không tìm thấy/.test(e.message))leave()}
}
function tick(){const s=Math.max(0,Math.round((S.dl-(Date.now()+S.off))/1000)),el=$('#tm');
 if(el)el.textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':');if(s<=0){clearInterval(tm);load()}}
function exam(){
 const n=S.qs.length,q=S.qs[S.i],da=Object.keys(S.ans).length;
 $('#root').innerHTML=`<div style="background:var(--menu);color:#fff;padding:10px 20px;display:flex;gap:12px;align-items:center">${emb(34)}<div><b>CÔNG AN XÃ THUẦN TRUNG</b><div style="font-size:.86em;opacity:.85">${esc(S.name)}</div></div></div>
 <div class="page"><div class="ex"><div class="card"><div class="row" style="margin:0"><b style="white-space:nowrap">Câu hỏi ${S.i+1} / ${n}</b><div class="bar2"><i style="width:${(S.i+1)/n*100}%"></i></div></div>
 <div class="qt">${esc(q.q)}</div>${q.o.map((o,i)=>`<button class="opt ${S.ans[S.i]===i?'on':''}" data-o="${i}"><span class="dot"></span><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}
 <div class="row"><button class="btn o" id="pv" ${S.i?'':'disabled'}>‹ Câu trước</button><button class="btn" id="nx" ${S.i<n-1?'':'disabled'}>Câu tiếp ›</button></div></div>
 <div><div class="card tmr"><span class="sub" style="text-align:left;display:block;font-size:.86em">Thời gian còn lại</span><b id="tm">--:--:--</b><div style="margin-top:8px;font-size:.86em;color:var(--mut)">Đã làm: ${da} · Chưa làm: ${n-da}</div></div>
 <div class="card"><b>Danh sách câu hỏi</b><div class="grid">${S.qs.map((_,i)=>`<button data-g="${i}" class="${i===S.i?'c':S.ans[i]!=null?'d':''}">${i+1}</button>`).join('')}</div></div><button class="btn" style="width:100%" id="sub">Nộp bài</button></div></div></div>${FOOT}`;
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const v=+b.dataset.o;S.ans[S.i]=v;api('answer',{...K,i:S.i,v},1).catch(()=>{});exam();tick()});
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.g;exam();tick()});
 $('#pv').onclick=()=>{S.i--;exam();tick()};$('#nx').onclick=()=>{S.i++;exam();tick()};
 $('#sub').onclick=async()=>{if(await ask(`Bạn đã làm ${da}/${n} câu. Nộp bài ngay?`)){try{await api('submit',K,1);load()}catch(e){toast(e.message,'er')}}};tick();
}
go();
</script>
</body>
</html>
