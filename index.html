<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hệ thống thi trắc nghiệm trực tuyến - Công an xã Thuần Trung</title>
<style>
:root{--navy:#0a2a6e;--blue:#1a5fe0;--bg:#f3f6fc;--line:#e3e9f5;--tx:#16233f;--mut:#6b7a99;--ok:#18a05a;--bad:#e5484d;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--line:#24324f;--tx:#e6ecf9;--mut:#93a2c4;--card:#15203a}}
*{box-sizing:border-box;margin:0}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--line)}.btn.s{padding:5px 11px;font-size:12px}.btn.r{background:var(--bad)}.btn.g{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:18px 10px}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.hero{background:var(--herobg,linear-gradient(160deg,var(--navy),#0f3a96 60%,#1b4eb8));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.hero h1{font-size:22px}.hero em{margin-top:22px;font-size:16px;line-height:1.7}
.side{display:flex;flex-direction:column;justify-content:space-between;background:var(--card)}
.box{max-width:420px;width:100%;margin:auto;padding:28px 22px;display:flex;flex-direction:column;gap:12px}
.box h2{text-align:center;font-size:21px}.sub{text-align:center;color:var(--mut)}
.box label,.fg label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.err{color:var(--bad);font-size:12px;min-height:16px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:8px}
.pick input{width:auto;margin-top:3px}.pick small{display:block;color:var(--mut)}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px;font-weight:700;font-size:13px;line-height:1.25}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav a{display:flex;gap:10px;padding:10px 12px;border-radius:8px;color:#d6e0fa;cursor:pointer;font-size:13px}
nav a.on{background:var(--blue);color:#fff;font-weight:600}
main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line)}
#menu{display:none;background:none;border:0;font-size:22px;cursor:pointer}
.page{padding:22px;flex:1}.page h2{font-size:18px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{border-radius:12px;color:#fff;padding:16px 18px;display:flex;flex-direction:column}.stat b{font-size:28px}.stat span{font-size:12px;opacity:.92}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools>input,.tools>select{flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);text-align:left;padding:10px;font-size:12px;color:var(--mut)}td{padding:10px;border-top:1px solid var(--line)}
.tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.tg{background:#dcf5e8;color:#0d7a42}.ty{background:#fdf0d4;color:#9a6200}.tr{background:#fde2e3;color:#b3262b}.tb{background:#dde8fd;color:#1b4fb8}.tx{background:#e8ebf2;color:#51607f}
.ic{background:none;border:0;cursor:pointer;font-size:15px;padding:2px 6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w{grid-column:1/-1}
.mod{position:fixed;inset:0;background:rgba(5,15,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mod>div{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.mod h3{margin-bottom:14px}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ex{display:grid;grid-template-columns:1fr 300px;gap:16px}
.bar2{height:8px;background:var(--line);border-radius:8px;overflow:hidden;flex:1}.bar2 i{display:block;height:100%;background:var(--ok)}
.qt{font-size:17px;font-weight:600;line-height:1.5;margin:14px 0}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;background:var(--card)}
.opt.on{border-color:var(--blue);background:rgba(26,95,224,.1)}
.dot{width:18px;height:18px;border:2px solid var(--mut);border-radius:50%;flex:none}.opt.on .dot{border:5px solid var(--blue)}
.tmr b{font-size:28px;color:var(--blue);display:block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 0;cursor:pointer;font-size:12px}
.grid .d{background:var(--ok);color:#fff;border-color:var(--ok)}.grid .c{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.center{max-width:480px;margin:8vh auto;text-align:center}.center h2{margin:10px 0}
.big{font-size:54px;font-weight:700;color:var(--blue)}
@media(max-width:860px){.split{grid-template-columns:1fr}.hero{padding:22px 18px}.hero em{margin-top:4px}
#app{grid-template-columns:1fr}aside{position:fixed;left:-250px;width:240px;z-index:8;transition:left .2s}aside.open{left:0}
#menu{display:block}.stats{grid-template-columns:1fr 1fr}.ex,.fg{grid-template-columns:1fr}.page{padding:14px}}

:root{--ff:Inter,"Segoe UI",Roboto,Arial,sans-serif;--z:1}
#root{zoom:var(--z)}aside{height:calc(100vh/var(--z))}.split{min-height:calc(100vh/var(--z))}
input,select,textarea,.btn,.opt,.pick,nav a,.grid button{border-radius:12px}.card,.stat,.box,.mod>div{border-radius:18px}.tw{border-radius:12px}
.card,.stat,.btn,nav a,.opt,.pick,.grid button,.ic{transition:transform .18s ease,box-shadow .18s ease,background .18s}
body:not(.nz) .card:hover{transform:scale(1.015);box-shadow:0 10px 28px rgba(10,30,80,.15)}
body:not(.nz) .stat:hover,body:not(.nz) .btn:hover,body:not(.nz) nav a:hover,body:not(.nz) .opt:hover,body:not(.nz) .pick:hover,body:not(.nz) .grid button:hover,body:not(.nz) .ic:hover{transform:scale(1.05)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes slin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.page>*,.box{animation:up .25s ease both}.mod{animation:fade .15s}.mod>div{animation:pop .2s ease}
#toasts{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--card);color:var(--tx);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:11px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:slin .3s ease;font-weight:600;transition:.3s}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.out{opacity:0;transform:translateX(40px)}
.pw{position:relative}.pw input{padding-right:42px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:16px;padding:4px 7px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px}.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mut)}.tabs button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qi{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:14px;margin-bottom:10px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:6px 0;font-size:13px;color:var(--mut)}.qo .ok{color:var(--ok);font-weight:700}.qa{display:flex;gap:6px;flex-shrink:0}.qi.in{border-color:var(--blue);background:rgba(26,95,224,.07)}
@media(max-width:640px){.qi{flex-direction:column}.qo{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FOOT='<div class="foot">Hệ thống phần mềm @ Công an xã Thuần Trung</div>';
const emb0=s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#e0a82e"/><circle cx="50" cy="50" r="34" fill="#c8202c"/><polygon points="50,24 56,42 76,42 60,54 66,74 50,62 34,74 40,54 24,42 44,42" fill="#ffd84a"/></svg>`;
const HERO=()=>`<div class="hero">${emb(110)}<h1>CÔNG AN XÃ THUẦN TRUNG</h1><p>Hệ thống thi trắc nghiệm trực tuyến</p><em>"Kỷ cương - Trách nhiệm<br>Hiệu quả - Vì Nhân dân phục vụ"</em></div>`;
const fmt=d=>d?new Date(d).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
let AT=sessionStorage.getItem('ttadm'),V='dash',MON=null,tm=null,pl=null,S=null,K=null;
const stop=()=>{clearInterval(tm);clearInterval(pl);tm=pl=null};
const RD=new Set(['dash','ql','el','res','ul']),MU=new Set(['qs','qd','qda','esel','qcp','es','ed','start','end','ext','qi','themeset','chpw','ures','ud']),MC={};
async function api(a,d={}){
 const kk=a+(d.eid??'');
 const run=async()=>{const r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(AT||'')},body:JSON.stringify({a,...d})});
  const j=await r.json().catch(()=>({e:'Không kết nối được máy chủ'}));
  if(r.status===401&&AT){AT=null;sessionStorage.removeItem('ttadm');go()}
  if(!r.ok)throw new Error(j.e||'Có lỗi xảy ra');if(RD.has(a))MC[kk]=JSON.stringify(j);return j};
 if(MU.has(a))for(const k in MC)delete MC[k];
 const c=RD.has(a)&&MC[kk];
 if(c){run().then(j=>{if(JSON.stringify(j)!==c&&!document.querySelector('.mod')&&AT)adminApp()}).catch(()=>{});return JSON.parse(c)}
 return run()}
function go(){stop();if(location.hash==='#admin')AT?adminApp():adminLogin();else{K=JSON.parse(localStorage.getItem('ttx')||'null');K?attempt():home()}}
window.onhashchange=go;

let TH={};try{TH=JSON.parse(localStorage.getItem('ttth')||'{}')}catch(e){}
const emb=s=>TH.logo?`<img src="${TH.logo}" width="${s}" height="${s}" style="object-fit:contain;border-radius:50%" alt="">`:emb0(s);
function applyTheme(t){TH=t||{};const s=document.documentElement.style,set=(k,v)=>v?s.setProperty(k,v):s.removeProperty(k);
 set('--navy',TH.menu);set('--bg',TH.bg);set('--blue',TH.blue);set('--ff',TH.ff);set('--z',TH.z);
 set('--herobg',TH.hero?`linear-gradient(rgba(8,24,70,.55),rgba(8,24,70,.55)),url("${TH.hero}") center/cover`:'');
 document.body.classList.toggle('nz',TH.zoom===false);try{localStorage.setItem('ttth',JSON.stringify(TH))}catch(e){}}
function toast(m,t){let c=$('#toasts');if(!c){c=document.createElement('div');c.id='toasts';document.body.appendChild(c)}const d=document.createElement('div');d.className='toast '+(t||'');d.textContent=m;c.appendChild(d);setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),320)},3200)}
const pwf=(id,l,ac)=>`<div><label for="${id}">${l}</label><div class="pw"><input id="${id}" type="password" autocomplete="${ac||'off'}"><button type="button" class="eye" aria-label="Hiện mật khẩu">👁️</button></div></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('.eye');if(b){const i=b.previousElementSibling;i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁️':'🙈'}});
const shrink=(f,m,ty)=>new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL(ty,.8))};i.onerror=no;i.src=u});
async function users(){
 const L=await api('ul');
 P(`<h2>Tài khoản thí sinh</h2><div class="card"><div class="tools"><span style="flex:1;color:var(--mut)">Tổng: ${L.length} tài khoản · Đặt lại mật khẩu sẽ đổi về 6 số cuối CCCD</span></div><div class="tw"><table><thead><tr><th>Họ và tên</th><th>CCCD</th><th>Đơn vị</th><th>SĐT</th><th>Thao tác</th></tr></thead><tbody>${L.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cccd)}</td><td>${esc(x.unit)}</td><td>${esc(x.phone)}</td><td style="white-space:nowrap"><button class="btn s o" data-r="${esc(x.cccd)}">Đặt lại MK</button> <button class="ic" data-d="${esc(x.cccd)}" aria-label="Xóa">🗑️</button></td></tr>`).join('')}</tbody></table></div></div>`);
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(confirm('Đặt lại mật khẩu về 6 số cuối CCCD?'))try{await api('ures',{cccd:b.dataset.r});toast('Đã đặt lại mật khẩu','ok')}catch(e){toast(e.message,'bad')}});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Xóa tài khoản này?'))try{await api('ud',{cccd:b.dataset.d});adminApp()}catch(e){toast(e.message,'bad')}})}
async function acc(){
 P(`<h2>Tài khoản quản trị</h2><form class="card" id="cf" style="max-width:460px;display:flex;flex-direction:column;gap:12px"><div><label for="nu">Tên đăng nhập mới (để trống nếu giữ nguyên)</label><input id="nu" autocomplete="username"></div>${pwf('op','Mật khẩu hiện tại','current-password')}${pwf('np','Mật khẩu mới (tối thiểu 6 ký tự)','new-password')}${pwf('np2','Nhập lại mật khẩu mới','new-password')}<div class="err" id="er"></div><button class="btn">Đổi mật khẩu</button></form>`);
 $('#cf').onsubmit=async e=>{e.preventDefault();$('#er').textContent='';try{if($('#np').value!==$('#np2').value)throw new Error('Mật khẩu nhập lại không khớp');const r=await api('chpw',{old:$('#op').value,p:$('#np').value,u:$('#nu').value.trim()});AT=r.token;sessionStorage.setItem('ttadm',AT);toast('Đã cập nhật tài khoản','ok');$('#cf').reset()}catch(x){$('#er').textContent=x.message}}}
async function theme(){
 const t={...TH},F=[['menu','Màu menu','#0a2a6e'],['bg','Màu nền','#f3f6fc'],['blue','Màu nút / điểm nhấn','#1a5fe0']];
 const fonts=[['','Mặc định'],['Arial,sans-serif','Arial'],['Tahoma,sans-serif','Tahoma'],['Georgia,serif','Georgia'],['"Times New Roman",serif','Times New Roman'],['"Courier New",monospace','Courier New']];
 P(`<h2>Giao diện</h2><div class="card" style="max-width:680px"><div class="fg">${F.map(f=>`<div><label>${f[1]}</label><input type="color" data-c="${f[0]}" value="${t[f[0]]||f[2]}" style="height:40px;padding:3px"></div>`).join('')}<div><label>Font chữ</label><select id="ff">${fonts.map(f=>`<option value="${esc(f[0])}" ${f[0]===(t.ff||'')?'selected':''}>${f[1]}</option>`).join('')}</select></div><div><label>Kích thước giao diện: <b id="zv">${Math.round((t.z||1)*100)}%</b></label><input type="range" id="z" min="80" max="130" step="5" value="${Math.round((t.z||1)*100)}"></div><div><label>Logo (ảnh vuông)</label><input type="file" id="lg" accept="image/*"></div><div><label>Ảnh nền trang đăng nhập</label><input type="file" id="hr" accept="image/*"></div><label class="w" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="zm" style="width:auto" ${t.zoom===false?'':'checked'}> Phóng to nhẹ khi di chuột vào mục</label></div><div class="act"><button class="btn o" id="rs">Khôi phục mặc định</button><button class="btn" id="sv">Lưu giao diện</button></div></div>`);
 const ap=()=>applyTheme(t);
 document.querySelectorAll('[data-c]').forEach(i=>i.oninput=()=>{t[i.dataset.c]=i.value;ap()});
 $('#ff').onchange=e=>{t.ff=e.target.value;ap()};
 $('#z').oninput=e=>{t.z=e.target.value/100;$('#zv').textContent=e.target.value+'%';ap()};
 $('#zm').onchange=e=>{t.zoom=e.target.checked;ap()};
 const img=(id,k,px,ty)=>$(id).onchange=async e=>{const f=e.target.files[0];if(f)try{t[k]=await shrink(f,px,ty);ap();toast('Đã chọn ảnh, bấm Lưu để áp dụng')}catch(x){toast('Không đọc được ảnh','bad')}};
 img('#lg','logo',256,'image/png');img('#hr','hero',1280,'image/jpeg');
 $('#sv').onclick=async()=>{try{await api('themeset',{t});toast('Đã lưu giao diện','ok')}catch(x){toast(x.message,'bad')}};
 $('#rs').onclick=async()=>{if(confirm('Khôi phục giao diện mặc định?'))try{await api('themeset',{t:{}});applyTheme({});adminApp()}catch(x){toast(x.message,'bad')}}}
function parseDocx(xml){
 const d=new DOMParser().parseFromString(xml,'application/xml'),on=e=>e&&!['0','false','none'].includes(e.getAttribute('w:val')||'');
 const fm=r=>{const p=r.getElementsByTagName('w:rPr')[0];if(!p)return false;const g=n=>p.getElementsByTagName(n)[0],c=g('w:color'),sh=g('w:shd');
  return !!(on(g('w:b'))||on(g('w:u'))||on(g('w:highlight'))||(c&&!['000000','auto',''].includes((c.getAttribute('w:val')||'').toLowerCase()))||(sh&&!['auto','ffffff',''].includes((sh.getAttribute('w:fill')||'').toLowerCase())))};
 const L=[];for(const p of d.getElementsByTagName('w:p')){let t='',fl='';const push=()=>{if(t.trim())L.push({t,fl});t='';fl=''};
  for(const r of p.getElementsByTagName('w:r')){const f=fm(r)?'1':'0';for(const n of r.children){const k=n.localName;if(k==='t'){t+=n.textContent;fl+=f.repeat(n.textContent.length)}else if(k==='br')push();else if(k==='tab'){t+=' ';fl+='0'}}}push()}
 const ST=/^\s*(câu|question)?\s*\d+\s*[.:)]\s*/i,LB=/^\s*\*?\s*([A-Da-d])\s*[.):]\s*/,KEY=/^\s*(đáp án|dap an|answer)\s*[:\-]?\s*([A-Da-d])/i,hasLb=L.some(l=>LB.test(l.t));
 const Q=[];let c=null;
 for(const l of L){let m;
  if(c&&(m=l.t.match(KEY))){c.key='ABCD'.indexOf(m[2].toUpperCase());continue}
  if(c&&(m=l.t.match(LB))&&c.o.length<4){c.o.push(l.t.slice(m[0].length).trim());c.f.push((l.fl.slice(m[0].length).match(/1/g)||[]).length+(/^\s*\*/.test(l.t)?1:0));continue}
  if(m=l.t.match(ST)){c={q:l.t.slice(m[0].length).trim(),o:[],f:[]};Q.push(c);continue}
  if(c&&!hasLb&&c.o.length<4&&c.q){c.o.push(l.t.trim());c.f.push((l.fl.match(/1/g)||[]).length);continue}
  if(c&&hasLb&&!c.o.length){c.q+=' '+l.t.trim();continue}
  c={q:l.t.trim(),o:[],f:[]};Q.push(c)}
 const list=[];let skip=0;

  P(`<div class="tools"><button class="btn s o" id="bk">‹ Quay lại</button><h2 style="margin:0;flex:1">${esc(e.name)}</h2><span class="tag ${s[1]}">${s[0]}</span>${canStart(e)?`<button class="btn s g" id="st">${e.mode==='live'?'Bắt đầu thi':'Mở'}</button>`:''}${canEnd(e)?`<button class="btn s r" id="en">${e.mode==='live'?'Kết thúc':'Đóng'}</button>`:''}${e.mode==='live'&&canEnd(e)?'<button class="btn s o" id="ex5">+5 phút</button>':''}</div>
  <div class="stats"><div class="stat" style="background:#1a8cff"><b>${at.length}</b><span>Đã vào phòng thi</span></div><div class="stat" style="background:#f5a623"><b>${at.length-dn}</b><span>Đang làm / chờ</span></div><div class="stat" style="background:#12a566"><b>${dn}</b><span>Đã nộp</span></div><div class="stat" style="background:#7a4ee0"><b>${at.filter(x=>x.ok).length}</b><span>Đạt</span></div></div>
  <div class="card">${tbl(['Họ và tên','Đơn vị','SĐT','Tiến độ','Trạng thái','Điểm'],at.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${esc(x.phone)}</td><td>${x.total?x.got+'/'+x.total:'-'}</td><td><span class="tag ${x.done?(x.ok?'tg':'tr'):x.total?'tb':'ty'}">${x.done?(x.ok?'Đạt':'Không đạt'):x.total?'Đang làm':'Chờ'}</span></td><td>${x.done?x.score:''}</td></tr>`).join(''))}</div>`);
  $('#bk').onclick=()=>{V='exams';adminApp()};
  if($('#ex5'))$('#ex5').onclick=async()=>{try{await api('ext',{id:MON,m:5});draw()}catch(x){toast(x.message)}};
  if($('#st'))$('#st').onclick=async()=>{await api('start',{id:MON});draw()};
  if($('#en'))$('#en').onclick=async()=>{if(confirm('Kết thúc kỳ thi? Các bài đang làm sẽ được nộp và chấm ngay.')){await api('end',{id:MON});draw()}};
 }catch(e){P(`<div class="card err">${esc(e.message)}</div>`)}};
 await draw();pl=setInterval(draw,5000);
}
const j2=s=>{try{return JSON.parse(s)||[]}catch(e){return[]}};
const selTxt=e=>{const m=e.sm||'random';return(m==='range'?`Câu ${e.ra||1}–${e.rb||e.qn}`:m==='manual'?`${j2(e.sids).length} câu chọn tay`:`${Math.min(e.cnt,e.qn)} câu ngẫu nhiên`)+` (kho ${e.qn})`};
function exForm(e){
 const dl=v=>v?new Date(v-new Date(v).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
 const F=[{k:'name',l:'Tên kỳ thi *',w:1}];
 if(!e)F.push({k:'mode',l:'Chế độ thi',t:'sel',o:['Thi tự do (làm bất cứ lúc nào)','Thi đồng loạt (admin bắt đầu / kết thúc)'],v:['free','live'],w:1});
 F.push({k:'dur',l:'Thời gian làm bài (phút)',t:'number'},{k:'cnt',l:'Số câu hỏi (khi chọn ngẫu nhiên)',t:'number'},{k:'t1',l:'Mở từ (tùy chọn, thi tự do)',t:'datetime-local'},{k:'t2',l:'Đóng lúc (tùy chọn, thi tự do)',t:'datetime-local'});
 modal(e?'Sửa kỳ thi':'Tạo kỳ thi mới',F,e?{name:e.name,dur:e.dur,cnt:e.cnt,t1:dl(e.t1),t2:dl(e.t2)}:{dur:30,cnt:10},async o=>{await api('es',{...o,id:e?e.id:0,t1:o.t1?new Date(o.t1).getTime():null,t2:o.t2?new Date(o.t2).getTime():null});toast(e?'Đã lưu kỳ thi':'Đã tạo kỳ thi, bấm "Câu hỏi" để thêm câu hỏi','ok')})}
let EQ=0;
async function eq(){
 const E=(await api('el')).find(x=>x.id===EQ);
 if(!E){V='exams';return adminApp()}
 const L=await api('ql',{eid:EQ}),sel=new Set(j2(E.sids)),R=(v,t)=>`<label style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--tx);margin:0"><input type="radio" name="sm" value="${v}" style="width:auto">${t}</label>`;
 P(`<div class="tools"><button class="btn s o" id="bk">‹ Quay lại</button><h2 style="margin:0;flex:1">Câu hỏi: ${esc(E.name)}</h2></div><div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 12px">Cách chọn câu hỏi cho đề thi</h3><div style="display:flex;flex-direction:column;gap:10px">${R('random','Ngẫu nhiên <input id="cn" type="number" min="1" style="width:90px" value="'+E.cnt+'"> câu cho mỗi thí sinh')}${R('range','Theo khoảng: từ câu <input id="ra" type="number" min="1" style="width:90px"> đến câu <input id="rb" type="number" min="1" style="width:90px">')}${R('manual','Chọn thủ công: tích vào ô vuông ở từng câu bên dưới')}</div><div class="tools" style="margin:12px 0 0"><span id="pool" style="flex:1;color:var(--mut)"></span><button class="btn" id="ss">Lưu cách chọn</button></div></div><div class="card"><div class="tools"><span style="flex:1;color:var(--mut)">Tổng: <b>${L.length}</b> câu hỏi</span><input id="qs" placeholder="Tìm câu hỏi..." style="max-width:200px"><button class="btn s o" id="sa">Chọn tất cả</button><button class="btn s o" id="sn">Bỏ chọn</button><button class="btn o" id="cp">Sao chép từ...</button><button class="btn o" id="iw">📄 Nhập từ Word</button><button class="btn o" id="imp">Nhập hàng loạt</button><button class="btn" id="add">+ Thêm câu hỏi</button><button class="btn r" id="da">Xóa tất cả</button></div><div id="ql"></div></div>`);
 const gsm=()=>document.querySelector('input[name=sm]:checked').value,setSm=v=>{document.querySelector(`input[name=sm][value=${v}]`).checked=true};
 setSm(E.sm||'random');$('#ra').value=E.ra||1;$('#rb').value=E.rb||L.length||1;
 const inR=i=>{const m=gsm();return m==='range'?i+1>=(+$('#ra').value||1)&&i+1<=(+$('#rb').value||L.length):m==='manual'?sel.has(L[i].id):true};
 const upd=()=>{const m=gsm(),n=L.filter((_,i)=>inR(i)).length;$('#pool').textContent=m==='random'?`Mỗi thí sinh nhận ${Math.min(+$('#cn').value||0,L.length)} / ${L.length} câu, bốc ngẫu nhiên`:`Đề gồm ${n} câu, xáo trộn thứ tự cho từng thí sinh`};
 const draw=()=>{const k=$('#qs').value.trim().toLowerCase(),m=gsm(),V2=L.map((x,i)=>({x,i})).filter(({x})=>!k||x.q.toLowerCase().includes(k)||x.o.some(o=>o.toLowerCase().includes(k)));
  $('#ql').innerHTML=V2.length?V2.map(({x,i})=>`<div class="qi${m!=='random'&&inR(i)?' in':''}"><input type="checkbox" class="pk" data-i="${x.id}" ${sel.has(x.id)?'checked':''} style="width:auto;margin-top:4px" aria-label="Chọn câu ${i+1}"><div style="flex:1"><b>Câu ${i+1}:</b> ${esc(x.q)}<div class="qo">${x.o.map((o,j)=>`<span class="${j===x.a?'ok':''}">${'ABCD'[j]}. ${esc(o)}</span>`).join('')}</div><small style="color:var(--mut)">${esc(x.subj||'')} · ${esc(x.lvl||'')}</small></div><div class="qa"><button class="btn s o" data-e="${x.id}">✏️ Sửa</button><button class="btn s r" data-d="${x.id}">🗑️ Xóa</button></div></div>`).join(''):'<p style="text-align:center;color:var(--mut)">Kỳ thi này chưa có câu hỏi. Hãy thêm, nhập từ Word hoặc sao chép từ nơi khác.</p>'};
 draw();upd();
 document.querySelectorAll('input[name=sm],#cn,#ra,#rb').forEach(i=>i.oninput=()=>{if(i.id==='ra'||i.id==='rb')setSm('range');if(i.id==='cn')setSm('random');draw();upd()});
 $('#qs').oninput=draw;
 $('#ql').onchange=e=>{const c=e.target;if(!c.classList.contains('pk'))return;c.checked?sel.add(+c.dataset.i):sel.delete(+c.dataset.i);setSm('manual');draw();upd()};
 $('#ql').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.e)qEdit(L.find(k=>k.id==b.dataset.e));
  if(b.dataset.d&&confirm('Xóa câu hỏi này?'))try{await api('qd',{id:+b.dataset.d});toast('Đã xóa câu hỏi');adminApp()}catch(x){toast(x.message,'bad')}};
 $('#bk').onclick=()=>{V='exams';adminApp()};
 $('#sa').onclick=()=>{L.forEach(x=>sel.add(x.id));setSm('manual');draw();upd()};
 $('#sn').onclick=()=>{sel.clear();setSm('manual');draw();upd()};
 $('#ss').onclick=async()=>{try{const m=gsm(),ra=+$('#ra').value||1,rb=+$('#rb').value||L.length;
  if(m==='range'&&ra>rb)throw new Error('Số câu bắt đầu phải nhỏ hơn hoặc bằng số câu kết thúc');
  if(m==='manual'&&!sel.size)throw new Error('Chưa tích chọn câu hỏi nào');
  if(m!=='random'&&!L.length)throw new Error('Kỳ thi chưa có câu hỏi');
  await api('esel',{id:EQ,sm:m,cnt:+$('#cn').value||1,ra,rb,sids:[...sel]});toast('Đã lưu cách chọn câu hỏi','ok')}catch(x){toast(x.message,'bad')}};
 $('#add').onclick=()=>qEdit(null);$('#iw').onclick=impWord;
 $('#da').onclick=async()=>{if(L.length&&confirm('CẢNH BÁO: xóa TOÀN BỘ câu hỏi của kỳ thi này?'))try{await api('qda',{eid:EQ});toast('Đã xóa toàn bộ câu hỏi');adminApp()}catch(x){toast(x.message,'bad')}};
 $('#cp').onclick=async()=>{const ex=(await api('el')).filter(x=>x.id!==EQ&&x.qn>0),old=(await api('qold')).n,o=[],v=[];
  if(old){o.push(`Ngân hàng cũ (${old} câu)`);v.push('old')}ex.forEach(x=>{o.push(`${x.name} (${x.qn} câu)`);v.push(x.id)});
  if(!o.length)return toast('Chưa có nguồn câu hỏi nào để sao chép','bad');
  modal('Sao chép câu hỏi vào kỳ thi này',[{k:'f',l:'Sao chép từ',t:'sel',o,v,w:1}],{},async r=>{const n=await api('qcp',{eid:EQ,from:r.f});toast('Đã sao chép '+n.n+' câu hỏi','ok')})};
 $('#imp').onclick=()=>modal('Nhập hàng loạt',[{k:'t',l:'Mỗi dòng 1 câu: Câu hỏi | A | B | C | D | Đáp án đúng (A-D) | Môn | Mức độ',t:'ta',w:1}],{},async o=>{
  const list=o.t.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(c=>c.length>=6&&c[0]).map(c=>({q:c[0],o:c.slice(1,5),a:'ABCD'.indexOf((c[5]||'').toUpperCase()),s:c[6],l:c[7]}));
  if(!list.length)throw new Error('Không đọc được dòng nào. Cần: Câu hỏi | A | B | C | D | Đáp án');
  const r=await api('qi',{eid:EQ,list});toast('Đã nhập '+r.n+'/'+list.length+' câu hỏi','ok')})}
function qEdit(x){
 const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div role="dialog"><h3>${x?'Chỉnh sửa câu hỏi':'Thêm câu hỏi'}</h3><form class="fg"><div class="w"><label>Nội dung câu hỏi *</label><textarea name="q" rows="3"></textarea></div><div class="w"><label>Các phương án và chọn đáp án đúng (*)</label>${[0,1,2,3].map(i=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="radio" name="c" value="${i}" style="width:auto" ${i===(x?x.a:0)?'checked':''} aria-label="Đáp án đúng ${'ABCD'[i]}"><input name="o${i}" placeholder="Đáp án ${'ABCD'[i]}${i<2?' *':''}"></div>`).join('')}</div><div><label>Môn học</label><input name="s"></div><div><label>Mức độ</label><select name="l">${['Dễ','Trung bình','Khó'].map(v=>`<option>${v}</option>`).join('')}</select></div><div class="act w"><span class="err" id="me" style="margin-right:auto"></span><button type="button" class="btn o" id="mc">Hủy</button><button class="btn">Lưu câu hỏi</button></div></form></div>`;
 document.body.appendChild(m);const f=m.querySelector('form');
 if(x){f.q.value=x.q;x.o.forEach((o,i)=>f['o'+i].value=o);f.s.value=x.subj||'';f.l.value=x.lvl||'Trung bình'}else{f.s.value='Pháp luật';f.l.value='Trung bình'}
 m.querySelector('#mc').onclick=()=>m.remove();
 f.onsubmit=async e=>{e.preventDefault();try{const q=f.q.value.trim(),c=+f.c.value,o=[0,1,2,3].map(i=>f['o'+i].value.trim());
  if(!q)throw new Error('Vui lòng nhập nội dung câu hỏi');if(!o[c])throw new Error('Đáp án đúng đang để trống');
  let a=0;const opts=[];o.forEach((v,i)=>{if(v){if(i===c)a=opts.length;opts.push(v)}});
  if(opts.length<2)throw new Error('Cần ít nhất 2 phương án');
  await api('qs',{eid:EQ,id:x?x.id:0,q,o:opts,a,subj:f.s.value.trim()||'Pháp luật',lvl:f.l.value});toast(x?'Đã cập nhật câu hỏi':'Đã thêm câu hỏi','ok');m.remove();adminApp()}catch(er){m.querySelector('#me').textContent=er.message}}}
async function res(){
 const L=await api('res');
 P(`<h2>Kết quả thi</h2><div class="card"><div class="tools"><span style="flex:1;color:var(--mut)">Tổng: ${L.length} kết quả</span><button class="btn o" id="csv">Xuất CSV</button></div>${tbl(['STT','Họ và tên','Đơn vị','Kỳ thi','Điểm','Nộp lúc','Kết quả'],L.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${esc(x.exam)}</td><td>${x.score}</td><td>${fmt(x.sub)}</td><td><span class="tag ${x.ok?'tg':'tr'}">${x.ok?'Đạt':'Không đạt'}</span></td></tr>`).join(''))}</div>`);
 $('#csv').onclick=()=>{const c='\ufeffHọ tên,Đơn vị,SĐT,Kỳ thi,Điểm,Nộp lúc,Kết quả\n'+L.map(x=>[x.name,x.unit,x.phone,x.exam,x.score,fmt(x.sub),x.ok?'Đạt':'Không đạt'].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='ket-qua-thi.csv';a.click()};
}
function modal(title,fields,vals,ok){
 const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div role="dialog"><h3>${title}</h3><form class="fg">${fields.map(f=>`<div class="${f.w?'w':''}"><label>${f.l}</label>${f.t==='sel'?`<select name="${f.k}">${f.o.map((o,i)=>`<option value="${f.v?f.v[i]:o}">${o}</option>`).join('')}</select>`:f.t==='ta'?`<textarea name="${f.k}" rows="3"></textarea>`:`<input name="${f.k}" type="${f.t||'text'}">`}</div>`).join('')}<div class="act w"><span class="err" id="me" style="margin-right:auto"></span><button type="button" class="btn o" id="mc">Hủy</button><button class="btn">Lưu</button></div></form></div>`;
 document.body.appendChild(m);const f=m.querySelector('form');
 fields.forEach(x=>{if(vals&&vals[x.k]!=null)f.elements[x.k].value=vals[x.k]});
 m.querySelector('#mc').onclick=()=>m.remove();
 f.onsubmit=async e=>{e.preventDefault();const o={};fields.forEach(x=>o[x.k]=f.elements[x.k].value.trim());
  try{await ok(o);m.remove();adminApp()}catch(x){m.querySelector('#me').textContent=x.message}}
}
applyTheme(TH);go();
api('theme').then(t=>{if(JSON.stringify(t)!==JSON.stringify(TH)){applyTheme(t);if(!(S&&S.s==='run')&&!document.querySelector('input:focus,.mod'))go()}}).catch(()=>{});
</script>
</body>
