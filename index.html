<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hệ thống thi trắc nghiệm trực tuyến - Công an xã Thuần Trung</title>
<style>
:root{--navy:#0a2a6e;--blue:#1a5fe0;--bg:#f3f6fc;--line:#e3e9f5;--tx:#16233f;--mut:#6b7a99;--ok:#18a05a;--bad:#e5484d;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1626;--line:#24324f;--tx:#e6ecf9;--mut:#93a2c4;--card:#15203a}}
*{box-sizing:border-box;margin:0}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--line)}.btn.s{padding:5px 11px;font-size:12px}.btn.r{background:var(--bad)}.btn.g{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:default}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:18px 10px}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.hero{background:var(--herobg,linear-gradient(160deg,var(--navy),#0f3a96 60%,#1b4eb8));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
.hero h1{font-size:22px}.hero em{margin-top:22px;font-size:16px;line-height:1.7}
.side{display:flex;flex-direction:column;justify-content:space-between;background:var(--card)}
.box{max-width:420px;width:100%;margin:auto;padding:28px 22px;display:flex;flex-direction:column;gap:12px}
.box h2{text-align:center;font-size:21px}.sub{text-align:center;color:var(--mut)}
.box label,.fg label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.err{color:var(--bad);font-size:12px;min-height:16px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:8px}
.pick input{width:auto;margin-top:3px}.pick small{display:block;color:var(--mut)}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 18px;font-weight:700;font-size:13px;line-height:1.25}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav a{display:flex;gap:10px;padding:10px 12px;border-radius:8px;color:#d6e0fa;cursor:pointer;font-size:13px}
nav a.on{background:var(--blue);color:#fff;font-weight:600}
main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line)}
#menu{display:none;background:none;border:0;font-size:22px;cursor:pointer}
.page{padding:22px;flex:1}.page h2{font-size:18px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{border-radius:12px;color:#fff;padding:16px 18px;display:flex;flex-direction:column}.stat b{font-size:28px}.stat span{font-size:12px;opacity:.92}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools>input,.tools>select{flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);text-align:left;padding:10px;font-size:12px;color:var(--mut)}td{padding:10px;border-top:1px solid var(--line)}
.tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.tg{background:#dcf5e8;color:#0d7a42}.ty{background:#fdf0d4;color:#9a6200}.tr{background:#fde2e3;color:#b3262b}.tb{background:#dde8fd;color:#1b4fb8}.tx{background:#e8ebf2;color:#51607f}
.ic{background:none;border:0;cursor:pointer;font-size:15px;padding:2px 6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w{grid-column:1/-1}
.mod{position:fixed;inset:0;background:rgba(5,15,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mod>div{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.mod h3{margin-bottom:14px}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ex{display:grid;grid-template-columns:1fr 300px;gap:16px}
.bar2{height:8px;background:var(--line);border-radius:8px;overflow:hidden;flex:1}.bar2 i{display:block;height:100%;background:var(--ok)}
.qt{font-size:17px;font-weight:600;line-height:1.5;margin:14px 0}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;background:var(--card)}
.opt.on{border-color:var(--blue);background:rgba(26,95,224,.1)}
.dot{width:18px;height:18px;border:2px solid var(--mut);border-radius:50%;flex:none}.opt.on .dot{border:5px solid var(--blue)}
.tmr b{font-size:28px;color:var(--blue);display:block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 0;cursor:pointer;font-size:12px}
.grid .d{background:var(--ok);color:#fff;border-color:var(--ok)}.grid .c{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.center{max-width:480px;margin:8vh auto;text-align:center}.center h2{margin:10px 0}
.big{font-size:54px;font-weight:700;color:var(--blue)}
@media(max-width:860px){.split{grid-template-columns:1fr}.hero{padding:22px 18px}.hero em{margin-top:4px}
#app{grid-template-columns:1fr}aside{position:fixed;left:-250px;width:240px;z-index:8;transition:left .2s}aside.open{left:0}
#menu{display:block}.stats{grid-template-columns:1fr 1fr}.ex,.fg{grid-template-columns:1fr}.page{padding:14px}}

:root{--ff:Inter,"Segoe UI",Roboto,Arial,sans-serif;--z:1}
#root{zoom:var(--z)}aside{height:calc(100vh/var(--z))}.split{min-height:calc(100vh/var(--z))}
input,select,textarea,.btn,.opt,.pick,nav a,.grid button{border-radius:12px}.card,.stat,.box,.mod>div{border-radius:18px}.tw{border-radius:12px}
.card,.stat,.btn,nav a,.opt,.pick,.grid button,.ic{transition:transform .18s ease,box-shadow .18s ease,background .18s}
body:not(.nz) .card:hover{transform:scale(1.015);box-shadow:0 10px 28px rgba(10,30,80,.15)}
body:not(.nz) .stat:hover,body:not(.nz) .btn:hover,body:not(.nz) nav a:hover,body:not(.nz) .opt:hover,body:not(.nz) .pick:hover,body:not(.nz) .grid button:hover,body:not(.nz) .ic:hover{transform:scale(1.05)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes slin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.page>*,.box{animation:up .25s ease both}.mod{animation:fade .15s}.mod>div{animation:pop .2s ease}
#toasts{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--card);color:var(--tx);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:11px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:slin .3s ease;font-weight:600;transition:.3s}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.out{opacity:0;transform:translateX(40px)}
.pw{position:relative}.pw input{padding-right:42px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:16px;padding:4px 7px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px}.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mut)}.tabs button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qi{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:14px;margin-bottom:10px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:6px 0;font-size:13px;color:var(--mut)}.qo .ok{color:var(--ok);font-weight:700}.qa{display:flex;gap:6px;flex-shrink:0}.qi.in{border-color:var(--blue);background:rgba(26,95,224,.07)}
@media(max-width:640px){.qi{flex-direction:column}.qo{grid-template-columns:1fr}}

.lg{display:grid;grid-template-columns:1.02fr 1fr;min-height:100vh;background:#f4f7fd;color:#0b1f4d}
.lg-l{position:relative;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 30px;text-align:center;overflow:hidden;background:var(--herobg,radial-gradient(1100px 560px at 15% 0%,#1d5fd1 0%,transparent 60%),radial-gradient(900px 500px at 100% 100%,#0f3fa3 0%,transparent 55%),linear-gradient(160deg,#0a2a6e,#0d3a9a 55%,#0a2a6e))}
.lg-l::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-32%;height:58%;background:radial-gradient(ellipse at 50% 100%,rgba(255,200,90,.38),transparent 62%);pointer-events:none}
.lg-l>*{position:relative}
.lg-l h1{font-size:clamp(26px,3.3vw,44px);margin:0;font-weight:800;background:linear-gradient(180deg,#ffe9a8,#f5b73a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-l .sys{letter-spacing:.3em;font-size:clamp(11px,1.1vw,14px);opacity:.92;font-weight:500}
.lg-l .ln{width:140px;height:2px;background:linear-gradient(90deg,transparent,#f5b73a,transparent)}
.slg{display:flex;align-items:center;gap:16px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border-radius:18px;padding:14px 26px;font-style:italic;font-size:clamp(14px,1.5vw,19px);max-width:560px;text-align:center}
.slg svg{flex:none;color:#f5b73a}
.fts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:18px;padding:14px 6px;max-width:620px;width:100%}
.fts div{padding:0 8px;font-size:12px;border-left:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;gap:6px}.fts div:first-child{border:0}
.lg-r{display:flex;flex-direction:column;padding:22px 32px;background:linear-gradient(180deg,#f8faff,#eef3fc)}
.lg-t{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#5a6b8c;gap:10px;flex-wrap:wrap}
.lg-t span{display:flex;gap:8px;align-items:center}
.hlp{display:flex;gap:8px;align-items:center;border:1px solid #d6e2f7;background:#fff;color:#1a5fe0;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600}
.lg-c{margin:auto;width:100%;max-width:640px;background:#fff;border-radius:28px;box-shadow:0 20px 60px rgba(30,70,160,.12);padding:36px 40px}
.lg-c h2{margin:0;text-align:center;font-size:28px;color:#0b1f4d}.lg-c .sb{text-align:center;color:#5a6b8c;margin:6px 0 22px}
.tb2{display:grid;grid-template-columns:1fr 1fr;background:#eef2fa;border-radius:14px;padding:4px}
.tb2 button{border:0;background:none;padding:12px;border-radius:12px;font-weight:600;color:#5a6b8c;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center;border-bottom:3px solid transparent}
.tb2 button.on{background:#fff;color:#0b4fd6;border-bottom-color:#1a5fe0;box-shadow:0 2px 8px rgba(30,70,160,.1)}
.f{margin-top:16px}.f label{display:block;font-weight:600;color:#33415f;margin-bottom:6px;font-size:14px}.f label i{color:#e03131;font-style:normal}
.f .in{position:relative}.f .in>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7a8bab}
.f .in input{width:100%;height:52px;padding:0 44px;border-radius:14px;border:1px solid #d6e0f2;background:#f4f7fd;font-size:15px;color:#0b1f4d}
.f .in .eye{right:10px}
.rm{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:14px;color:#33415f}.rm label{display:flex;gap:8px;align-items:center;margin:0}.rm input{width:18px;height:18px}.rm a{color:#1a5fe0;text-decoration:underline;cursor:pointer}
.big-btn{width:100%;height:56px;margin-top:18px;border:0;border-radius:14px;color:#fff;font-size:17px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,#1a6ef5,#0a4fd6);box-shadow:0 10px 24px rgba(26,95,224,.35);display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
.big-btn .ar,.adm-btn .ar{position:absolute;right:20px;display:flex}
.or{display:flex;align-items:center;gap:12px;color:#7a8bab;margin:16px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:#dbe4f4}
.adm-btn{width:100%;height:52px;border:1px solid #1a5fe0;border-radius:14px;background:#fff;color:#0b4fd6;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;text-decoration:none}
.trust{display:flex;justify-content:center;margin-top:20px;font-size:12px;color:#5a6b8c;flex-wrap:wrap;row-gap:8px}.trust span{display:flex;gap:8px;align-items:center;padding:0 18px;border-left:1px solid #d6e0f2}.trust span:first-child{border:0}.trust svg{color:#1a5fe0;flex:none}
.lg-f{text-align:center;color:#8a98b5;font-size:12px;margin-top:14px}
@media(max-width:900px){.lg{grid-template-columns:1fr}.lg-l{padding:26px 16px}.fts,.slg{display:none}.lg-c{padding:24px 18px}.lg-r{padding:14px}}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;opacity:0;pointer-events:none;transition:opacity .15s;background:linear-gradient(90deg,transparent,var(--blue),transparent) no-repeat;background-size:40% 100%;animation:bar 1s linear infinite}
body.ld #bar{opacity:1}body.ld::after{content:"";position:fixed;inset:0;z-index:250;cursor:progress}
@keyframes bar{from{background-position:-40% 0}to{background-position:140% 0}}

:root{--pg:#0f7a4d;--pgd:#08492f}
.p-app{display:grid;grid-template-columns:292px 1fr;min-height:calc(100vh/var(--z));background:var(--bg)}
.p-app.col{grid-template-columns:0 1fr}.p-app.col .p-side{display:none}
.p-side{position:sticky;top:0;height:calc(100vh/var(--z));overflow:auto;display:flex;flex-direction:column;padding:22px 14px 14px;color:#fff;background:repeating-radial-gradient(circle at 15% 88%,rgba(255,255,255,.055) 0 2px,transparent 2px 15px),linear-gradient(180deg,var(--pg),var(--pgd))}
.p-brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:17px;line-height:1.25;padding:0 6px}
.p-sys{font-size:11px;letter-spacing:.14em;opacity:.85;padding:12px 6px 18px;border-bottom:1px solid rgba(255,255,255,.16);margin-bottom:16px}
.p-nav a{display:flex;gap:14px;align-items:center;padding:13px 16px;border-radius:14px;cursor:pointer;margin-bottom:6px;color:rgba(255,255,255,.92);font-weight:500;transition:.18s}
.p-nav a:hover{background:rgba(255,255,255,.12)}.p-nav a.on{background:linear-gradient(90deg,#1bb274,#0f8a55);box-shadow:0 8px 18px rgba(0,0,0,.22);color:#fff;font-weight:700}
.p-sec{margin-top:auto;display:flex;gap:12px;align-items:center;font-size:12px;line-height:1.5;opacity:.92;padding:16px 6px;border-top:1px solid rgba(255,255,255,.16)}
.p-out{display:flex;gap:14px;align-items:center;padding:12px 16px;cursor:pointer;border-top:1px solid rgba(255,255,255,.16);border-radius:12px}.p-out:hover{background:rgba(255,255,255,.1)}
.p-main{min-width:0;display:flex;flex-direction:column}
.p-ban{position:relative;padding:20px 28px 22px;min-height:270px;background:linear-gradient(90deg,rgba(255,255,255,.96) 0,rgba(255,255,255,.82) 38%,rgba(255,255,255,0) 66%),var(--pbanner,linear-gradient(120deg,#e6f4ec,#c2e4d2 55%,#92cbb0));color:#0b2a4a}
.p-tb{display:flex;gap:12px;align-items:center}
.p-ib{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#0b2a4a;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.p-ib .bd{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font:700 11px/18px sans-serif;text-align:center;font-style:normal;padding:0 4px}
.p-ib#menu{background:none;box-shadow:none;color:var(--pg)}
.p-um{position:relative;display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1);color:#0b2a4a}
.p-um b{display:block;font-size:14px}.p-um small{color:#6b7a90}
.p-um .av{width:38px;height:38px;border-radius:50%;background:var(--pg);color:#fff;display:flex;align-items:center;justify-content:center}
.p-menu{display:none;position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);min-width:210px;padding:6px;z-index:20}
.p-um.open .p-menu{display:block}.p-menu a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#0b2a4a}.p-menu a:hover{background:#eef6f1}
.p-hi{margin-top:6px}.p-hi h1{margin:0;font-size:32px;line-height:1.2;color:#0b2a4a}.p-hi p{margin:8px 0 0;color:var(--pg);font-size:16px;font-weight:500}
.p-chips{display:flex;gap:6px;margin-top:20px;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);border-radius:18px;padding:10px 8px;width:max-content;max-width:100%;flex-wrap:wrap}
.p-chips>div{display:flex;gap:12px;align-items:center;padding:4px 18px;border-left:1px solid rgba(0,0,0,.07)}.p-chips>div:first-child{border:0}
.ti{width:46px;height:46px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.p-chips b{display:block;font-size:14px}.p-chips small{display:block;color:#6b7a90;font-size:12px}
.p-body{display:grid;grid-template-columns:1fr 340px;gap:18px;padding:18px 24px;align-items:start}.p-body.one{grid-template-columns:1fr}
.p-card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 6px 24px rgba(20,60,40,.08);border:1px solid var(--line)}
.p-ch{display:flex;gap:12px;align-items:center;margin-bottom:14px}.p-ch b{font-size:17px;flex:1}.p-ch a{color:var(--pg);font-size:13px;cursor:pointer;display:flex;gap:4px;align-items:center}
.p-ch .ti{width:42px;height:42px;border-radius:12px}
.p-lh{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.p-lh h2{margin:0;font-size:22px}.p-lh p{margin:2px 0 0;color:var(--mut)}
.p-sr{position:relative;flex:1;min-width:180px;max-width:300px}.p-sr svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.p-sr input{width:100%;height:44px;padding:0 12px 0 38px;border-radius:12px}
.flt{position:relative;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--tx)}.flt select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.p-ex{--ac:#12905a;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:14px;background:linear-gradient(100deg,color-mix(in srgb,var(--ac) 9%,var(--card)),var(--card) 60%);transition:transform .18s,box-shadow .18s,border-color .18s}
.p-ex:hover{border-color:var(--ac);box-shadow:0 10px 28px rgba(0,0,0,.1);transform:scale(1.01)}
.p-ex .ti.big{width:66px;height:66px;border-radius:20px;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac)}
.p-ex h3{margin:0;font-size:18px;text-transform:uppercase}

  const m=dlg(`<h3>Các bộ đề của kỳ thi (${P2.length} bộ)</h3>${tbl(['Bộ đề','Số câu','Thí sinh đã nhận','Thao tác'],P2.map(x=>`<tr><td>Bộ đề ${x.no}</td><td>${x.c}</td><td>${x.u}</td><td><button class="btn s o" data-p="${x.id}">Xem chi tiết</button></td></tr>`).join(''))}<div class="act"><button class="btn o" id="cl">Đóng</button></div>`);
  m.querySelector('#cl').onclick=()=>m.remove();
  m.onclick=async e=>{if(e.target===m)return m.remove();const b=e.target.closest('[data-p]');if(!b)return;
   try{const d=await api('pd',{id:+b.dataset.p});
    const m2=dlg(`<h3>Bộ đề ${d.no} · ${d.qs.length} câu</h3>${d.qs.map((x,i)=>`<div class="qi"><div style="flex:1"><b>Câu ${i+1}:</b> ${esc(x.q)}<div class="qo">${x.o.map((o,j)=>`<span class="${j===x.a?'ok':''}">${'ABCD'[j]}. ${esc(o)}</span>`).join('')}</div></div></div>`).join('')}<div class="act"><button class="btn o" id="c2">Đóng</button></div>`);
    m2.querySelector('#c2').onclick=()=>m2.remove()}catch(x){toast(x.message,'bad')}}};
 $('#add').onclick=()=>qEdit(null);$('#iw').onclick=impWord;
 $('#da').onclick=async()=>{if(L.length&&confirm('CẢNH BÁO: xóa TOÀN BỘ câu hỏi của kỳ thi này?'))try{await api('qda',{eid:EQ});toast('Đã xóa toàn bộ câu hỏi');adminApp()}catch(x){toast(x.message,'bad')}};
 $('#cp').onclick=async()=>{const ex=(await api('el')).filter(x=>x.id!==EQ&&x.qn>0),old=(await api('qold')).n,o=[],v=[];
  if(old){o.push(`Ngân hàng cũ (${old} câu)`);v.push('old')}ex.forEach(x=>{o.push(`${x.name} (${x.qn} câu)`);v.push(x.id)});
  if(!o.length)return toast('Chưa có nguồn câu hỏi nào để sao chép','bad');
  modal('Sao chép câu hỏi vào kỳ thi này',[{k:'f',l:'Sao chép từ',t:'sel',o,v,w:1}],{},async r=>{const n=await api('qcp',{eid:EQ,from:r.f});toast('Đã sao chép '+n.n+' câu hỏi','ok')})};
 $('#imp').onclick=()=>modal('Nhập hàng loạt',[{k:'t',l:'Mỗi dòng 1 câu: Câu hỏi | A | B | C | D | Đáp án đúng (A-D) | Môn | Mức độ',t:'ta',w:1}],{},async o=>{
  const list=o.t.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(c=>c.length>=6&&c[0]).map(c=>({q:c[0],o:c.slice(1,5),a:'ABCD'.indexOf((c[5]||'').toUpperCase()),s:c[6],l:c[7]}));
  if(!list.length)throw new Error('Không đọc được dòng nào. Cần: Câu hỏi | A | B | C | D | Đáp án');
  const r=await api('qi',{eid:EQ,list});toast('Đã nhập '+r.n+'/'+list.length+' câu hỏi','ok')})}
function qEdit(x){
 const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div role="dialog"><h3>${x?'Chỉnh sửa câu hỏi':'Thêm câu hỏi'}</h3><form class="fg"><div class="w"><label>Nội dung câu hỏi *</label><textarea name="q" rows="3"></textarea></div><div class="w"><label>Các phương án và chọn đáp án đúng (*)</label>${[0,1,2,3].map(i=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input type="radio" name="c" value="${i}" style="width:auto" ${i===(x?x.a:0)?'checked':''} aria-label="Đáp án đúng ${'ABCD'[i]}"><input name="o${i}" placeholder="Đáp án ${'ABCD'[i]}${i<2?' *':''}"></div>`).join('')}</div><div><label>Môn học</label><input name="s"></div><div><label>Mức độ</label><select name="l">${['Dễ','Trung bình','Khó'].map(v=>`<option>${v}</option>`).join('')}</select></div><div class="act w"><span class="err" id="me" style="margin-right:auto"></span><button type="button" class="btn o" id="mc">Hủy</button><button class="btn">Lưu câu hỏi</button></div></form></div>`;
 document.body.appendChild(m);const f=m.querySelector('form');
 if(x){f.q.value=x.q;x.o.forEach((o,i)=>f['o'+i].value=o);f.s.value=x.subj||'';f.l.value=x.lvl||'Trung bình'}else{f.s.value='Pháp luật';f.l.value='Trung bình'}
 m.querySelector('#mc').onclick=()=>m.remove();
 f.onsubmit=async e=>{e.preventDefault();try{const q=f.q.value.trim(),c=+f.c.value,o=[0,1,2,3].map(i=>f['o'+i].value.trim());
  if(!q)throw new Error('Vui lòng nhập nội dung câu hỏi');if(!o[c])throw new Error('Đáp án đúng đang để trống');
  let a=0;const opts=[];o.forEach((v,i)=>{if(v){if(i===c)a=opts.length;opts.push(v)}});
  if(opts.length<2)throw new Error('Cần ít nhất 2 phương án');
  await api('qs',{eid:EQ,id:x?x.id:0,q,o:opts,a,subj:f.s.value.trim()||'Pháp luật',lvl:f.l.value});toast(x?'Đã cập nhật câu hỏi':'Đã thêm câu hỏi','ok');m.remove();adminApp()}catch(er){m.querySelector('#me').textContent=er.message}}}
function modal(title,fields,vals,ok){
 const m=document.createElement('div');m.className='mod';
 m.innerHTML=`<div role="dialog"><h3>${title}</h3><form class="fg">${fields.map(f=>`<div class="${f.w?'w':''}"><label>${f.l}</label>${f.t==='sel'?`<select name="${f.k}">${f.o.map((o,i)=>`<option value="${f.v?f.v[i]:o}">${o}</option>`).join('')}</select>`:f.t==='ta'?`<textarea name="${f.k}" rows="3"></textarea>`:`<input name="${f.k}" type="${f.t||'text'}">`}</div>`).join('')}<div class="act w"><span class="err" id="me" style="margin-right:auto"></span><button type="button" class="btn o" id="mc">Hủy</button><button class="btn">Lưu</button></div></form></div>`;
 document.body.appendChild(m);const f=m.querySelector('form');
 fields.forEach(x=>{if(vals&&vals[x.k]!=null)f.elements[x.k].value=vals[x.k]});
 m.querySelector('#mc').onclick=()=>m.remove();
 f.onsubmit=async e=>{e.preventDefault();const o={};fields.forEach(x=>o[x.k]=f.elements[x.k].value.trim());
  try{await ok(o);m.remove();adminApp()}catch(x){m.querySelector('#me').textContent=x.message}}
}
document.body.insertAdjacentHTML('afterbegin','<div id="bar"></div>');applyTheme(TH);go();
api('theme').then(t=>{if(JSON.stringify(t)!==JSON.stringify(TH)){applyTheme(t);if(!(S&&S.s==='run')&&!document.querySelector('input:focus,.mod'))go()}}).catch(()=>{});
</script>
